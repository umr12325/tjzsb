<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天津专升本 · 语文基础题库（2023修订版）</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --red:#d7263d;--red-d:#ad1c2f;--red-l:#fdecee;
  --bg:#f5f6f8;--card:#ffffff;--line:#e9ebef;--txt:#1f2329;--sub:#71767d;
  --ok:#12894f;--ok-l:#e8f7ef;--bad:#d7263d;--bad-l:#fdecee;--warn:#b7791f;
}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);line-height:1.65;font-size:15px;
}
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;background:none;color:inherit}
#app{max-width:960px;margin:0 auto;padding:0 16px 80px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:rgba(245,246,248,.92);
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;
  padding:12px 0 10px;border-bottom:1px solid var(--line);
}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.topbar .dot{width:10px;height:10px;border-radius:3px;background:var(--red)}
.topbar .sp{flex:1}
.ghost{color:var(--sub);padding:6px 10px;border-radius:8px}
.ghost:hover{background:#eceef1;color:var(--txt)}

/* ---------- 首页 ---------- */
.hero{
  background:linear-gradient(135deg,#d7263d,#a3172a);color:#fff;border-radius:18px;
  padding:22px 22px 18px;margin:16px 0 22px;position:relative;overflow:hidden;
}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{margin:0 0 6px;font-size:22px;letter-spacing:.5px}
.hero p{margin:0;opacity:.85;font-size:13px}
.hero .stat-row{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.hero .stat b{font-size:22px;line-height:1.2}
.hero .stat span{display:block;font-size:12px;opacity:.8}
.hero .hero-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hero .hero-actions button{
  background:rgba(255,255,255,.16);color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;
  border:1px solid rgba(255,255,255,.25);
}
.hero .hero-actions button:hover{background:rgba(255,255,255,.26)}

.sec-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec-title h2{font-size:16px;margin:0}
.sec-title span{font-size:12px;color:var(--sub)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;
  transition:.16s;position:relative;overflow:hidden;min-width:0;
}
.card:hover{border-color:#d9dbe0;box-shadow:0 6px 18px rgba(20,20,40,.06);transform:translateY(-1px)}
.card .ic{font-size:20px;line-height:1}
.card h3{margin:8px 0 4px;font-size:14.5px;display:flex;align-items:center;gap:6px}
.card .desc{font-size:12px;color:var(--sub);min-height:34px;margin:0 0 10px}
.card .bottom{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--sub)}
.card .go{color:var(--red);font-weight:600}
.card .acts{display:flex;align-items:center;gap:8px}
.card .mini{font-size:11px;padding:2px 8px;border-radius:20px;background:#f2f3f6;color:#5b6169}
.card .mini:hover{background:var(--red-l);color:var(--red)}
.card .mini-bar{height:4px;background:#eef0f3;border-radius:4px;margin:10px 0 8px;overflow:hidden}
.card .mini-bar i{display:block;height:100%;background:var(--red);border-radius:4px;transition:.3s}
.card .tag{position:absolute;right:12px;top:12px;font-size:11px;color:var(--sub);background:#f2f3f6;padding:1px 7px;border-radius:20px}
.card .tag.st{background:#e8f7ef;color:#12894f;font-weight:600}
.card.done .mini-bar i{background:var(--ok)}
.card.done .go{color:var(--ok)}

.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:26px;font-size:12.5px;color:var(--sub)}
.note b{color:var(--txt)}
.note ul{margin:8px 0 0;padding-left:18px}
.note li{margin:3px 0}

/* ---------- 答题页 ---------- */
.subj-tabs{display:flex;gap:8px;padding:10px 0 4px;overflow:auto}
.subj-tabs button{flex:none;padding:8px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:13px;color:#5b6169}
.subj-tabs button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.quiz-head{display:flex;align-items:center;gap:12px;padding:12px 0}
.quiz-head .title{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quiz-head .count{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.pbar{height:6px;background:#e9ebef;border-radius:6px;overflow:hidden;margin-bottom:16px}
.pbar i{display:block;height:100%;background:var(--red);transition:.25s}

.qcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 20px 8px}
.qmeta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub);margin-bottom:10px;flex-wrap:wrap}
.pill{background:#f2f3f6;color:#5b6169;padding:2px 8px;border-radius:20px;font-size:11.5px}
.pill.red{background:var(--red-l);color:var(--red-d)}
.pill.blue{background:#e8f0fb;color:#1d4ed8}
.pill.star{background:#fff4e6;color:#b45309;font-weight:600}
.stem{font-size:16px;line-height:1.8;margin:4px 0 16px;white-space:pre-wrap}
.mat{background:#f8fafc;border:1px solid #e2e8f0;border-left:3px solid #94a3b8;border-radius:10px;padding:12px 14px;margin:0 0 14px;font-size:13.5px;line-height:1.85;white-space:pre-wrap;color:#334155;max-height:340px;overflow:auto}
.opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.opt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:12px;background:#fff;transition:.12s;font-size:14.5px;line-height:1.6;width:100%;
}
.opt:hover{border-color:#cfd3da;background:#fafbfc}
.opt .k{
  flex:none;width:22px;height:22px;border-radius:50%;background:#f2f3f6;color:#5b6169;
  font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:1px;
}
.opt.correct{border-color:var(--ok);background:var(--ok-l)}
.opt.sel{outline:2px solid var(--red);background:#fff5f5}
.fill-input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;box-sizing:border-box}
.fill-input:disabled{background:#f7f8fa;color:#334155}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.opt.sel{border-color:var(--red);background:var(--red-l)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt[disabled]:hover{background:inherit}

.exp{margin:14px 0 6px;padding:14px 16px;border-radius:12px;background:#f7f8fa;border-left:3px solid var(--red);font-size:13.5px;line-height:1.75;white-space:pre-wrap}
.exp b{color:var(--red-d)}
.exp.hidden{display:none}

.textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:14px;resize:vertical;background:#fcfcfd}
.textarea:focus{outline:none;border-color:#c7ccd4}
.ansbox{margin-top:12px;padding:14px 16px;border-radius:12px;background:var(--ok-l);border-left:3px solid var(--ok);font-size:13.5px;line-height:1.8;white-space:pre-wrap}
.self{display:flex;gap:10px;margin:14px 0 8px;flex-wrap:wrap}
.qbtns{display:flex;gap:10px;margin:6px 0 16px;flex-wrap:wrap}
.qbtns .btn{font-size:13px}
.btn{border-radius:10px;padding:9px 16px;font-size:14px;background:#f2f3f6;color:#3d4249;transition:.12s}
.btn:hover{background:#e8eaee}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-d)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:#fff;color:var(--bad);border:1px solid #f3c2c9}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.quiz-foot{display:flex;gap:10px;justify-content:space-between;margin-top:16px;align-items:center}
.quiz-foot .mid{color:var(--sub);font-size:12.5px}
.navdots{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.navdots button{width:30px;height:30px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:12px;color:#5b6169}
.navdots button.cur{border-color:var(--red);color:var(--red);font-weight:700}
.navdots button.ok{background:var(--ok-l);border-color:#b8e3c9;color:var(--ok)}
.navdots button.bad{background:var(--bad-l);border-color:#f3c2c9;color:var(--bad)}

/* ---------- 结果页 ---------- */
.result{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center;margin-top:20px}
.result .score{font-size:46px;font-weight:800;color:var(--red);line-height:1.1}
.result .score small{font-size:16px;font-weight:500;color:var(--sub)}
.result .sub{color:var(--sub);font-size:13px;margin-top:6px}
.result .actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.wrong-list{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.wrong-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px}
.wrong-item .q{font-weight:600;margin-bottom:6px}
.wrong-item .a{color:var(--ok);font-size:13px}
.wrong-item .e{color:var(--sub);font-size:12.5px;margin-top:6px;white-space:pre-wrap}

.empty{text-align:center;color:var(--sub);padding:60px 0;font-size:14px}
.note-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 16px}
.seg{display:inline-flex;background:#eceef1;border-radius:10px;padding:3px;margin:0 0 12px}
.seg button{padding:6px 16px;border-radius:8px;font-size:13px;color:#5b6169}
.seg button.on{background:#fff;color:var(--red);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.note-row{display:flex;gap:14px;padding:9px 0;border-bottom:1px dashed #eef0f3;font-size:13.5px}
.note-row:last-child{border-bottom:none}
.note-row b{flex:none;min-width:72px;color:var(--red-d)}
.note-row span{color:#3d4249}
.point-list{margin:8px 0 8px;padding-left:20px;font-size:13.5px;line-height:1.9}
.point-list li{margin:2px 0}
.qa-row{display:flex;gap:14px;padding:10px 0;border-bottom:1px dashed #eef0f3;font-size:13.5px;line-height:1.8}
.qa-row:last-child{border-bottom:none}
.qa-row b{flex:none;max-width:46%;color:#334155}
.qa-row span{color:#0f766e}
.qa-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 16px}
.qa{border-bottom:1px dashed #eef0f3;padding:10px 0}
.qa:last-child{border-bottom:none}
.qa summary{cursor:pointer;font-size:13.5px;line-height:1.8;color:#1f2329}
.qa summary:hover{color:var(--red)}
.qa-a{margin:8px 0 2px;padding:10px 12px;background:#f7f8fa;border-left:3px solid var(--red);border-radius:8px;font-size:13px;line-height:1.8;white-space:pre-wrap}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--sub);font-size:13px;margin-top:26px;text-decoration:none}
.back-link:hover{color:var(--txt)}

@media (max-width:560px){
  #app{padding:0 12px 70px}
  .hero{padding:18px 16px 16px;border-radius:14px}
  .hero h1{font-size:19px}
  .hero p{font-size:12.5px}
  .qcard{padding:16px 14px 6px}
  .stem{font-size:15px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .card{padding:12px}
  .card .desc{display:none}
  .card h3{font-size:13px}
}
@media (max-width:430px){
  .grid{grid-template-columns:1fr}
  .card .desc{display:block;min-height:0}
  .stat-row{gap:16px}
  .hero .hero-actions button{padding:7px 12px;font-size:12.5px}
  .subj-tabs button{padding:7px 10px;font-size:12.5px}
}

/* ---------- 文字加粗、增强可读性 ---------- */
:root{--txt:#111418;--sub:#4d545c}
body{font-size:15.5px;font-weight:500;line-height:1.8;color:#111418;-webkit-font-smoothing:antialiased}
.topbar .brand{font-weight:800}
.hero h1{font-weight:800}
.hero p{opacity:.95;font-weight:500}
.hero .stat b{font-weight:800}
.hero .stat span{opacity:.92;font-weight:500}
.sec-title h2{font-weight:800}
.sec-title span{color:#4d545c;font-weight:500}
.card h3{font-weight:700;color:#111418}
.card .desc{color:#4b5563;font-size:12.8px;font-weight:500}
.card .bottom{color:#4b5563;font-weight:500}
.stem{font-weight:600;color:#0f1216}
.opt{font-weight:500;color:#16191d}
.opt .k{font-weight:700}
.exp{font-weight:500;color:#262b31}
.note,.note-box{font-weight:500;color:#262b31;line-height:1.95}
.mat{color:#262b31;font-weight:500;line-height:1.95}
.qa summary{font-weight:500;color:#14171a}
.qa-a{font-weight:500;color:#1f2329;line-height:1.9}
.qa-row b{font-weight:700;color:#1f2937}
.qa-row span{font-weight:500;color:#0b5d4f}
.pill{font-weight:600}
.qmeta .pill{font-weight:600}
.quiz-head .title{font-weight:800}
.quiz-foot .mid{font-weight:600}
.wrong-item .q{font-weight:600;color:#111418}
.wrong-item .a{font-weight:600}
.wrong-item .e{font-weight:500;color:#2b3038}


/* ---------- 课内精讲：全部文字加粗、放大 ---------- */
.qcard{font-weight:600;color:#0d1013}
.qcard .stem{font-weight:600;font-size:16.5px;line-height:2;letter-spacing:.2px}
.note-box{font-weight:600;color:#0d1013}
.note-row{font-weight:600;color:#0d1013;font-size:14.5px;line-height:1.9}
.note-row b{font-weight:800;color:#111418}
.note-row span{font-weight:600;color:#1e242b}
.point-list li{font-weight:600;color:#0d1013;line-height:1.95}
.qa-box{font-weight:600}
.qa summary{font-weight:700;color:#0d1013}
.qa-a{font-weight:600;color:#14181d;line-height:1.95}
.qa-row{font-size:14.5px}
.qa-row b{font-weight:800}
.qa-row span{font-weight:600;color:#0b5d4f}
.seg button{font-weight:700}

/* 课内精讲：进一步加粗 */
.qcard,.qcard .stem,.note-box,.note-row,.note-row span,.point-list li,.qa-a,.qa-row span{font-weight:700}
.note-row b,.qa-row b,.qa summary{font-weight:800}
.qcard .stem{font-size:17px;line-height:2.05}
.note-row,.qa-row{font-size:15px}

</style>

{id:'H01',r:'H',y:'2024',src:'真题',t:'text',tag:'饮酒（其五）',
 stem:'阅读《饮酒（其五）》，回答问题。\n结庐在人境，而无车马喧。问君何能尔？心远地自偏。采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。\n（1）用“‖”给全诗划分层次。（3分）\n（2）概括每层所写内容。（3分）\n（3）全诗表达了怎样的思想情感？（2分）',
 ans:'（1）结庐在人境，而无车马喧。‖问君何能尔？心远地自偏。‖采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。\n（2）第一层写身居尘世却无车马之喧；第二层自问自答，点出“心远”则地自偏；第三层写采菊、南山、山气、飞鸟，归结于“真意”。\n（3）表达远离尘嚣、归隐田园的恬淡自适，以及从自然中领悟人生真意的哲思。'},

{id:'H02',r:'H',y:'2023',src:'真题',t:'text',tag:'谏逐客书',
 stem:'阅读《谏逐客书》选段，回答问题。\n臣闻吏议逐客，窃以为过矣。昔穆公求士，西取由余于戎……此五子者，不产于秦，而穆公用之，并国二十，遂霸西戎。孝公用商鞅之法……惠王用张仪之计……昭王得范雎……使秦成帝业。此四君者，皆以客之功。由此观之，客何负于秦哉！\n（1）用“‖”把这段文字分为三层。（3分）\n（2）指出本段的中心论点。（2分）\n（3）本段运用了哪些论证方法？（3分）',
 ans:'（1）臣闻吏议逐客，窃以为过矣。‖昔穆公求士……使秦成帝业。‖此四君者，皆以客之功……客何负于秦哉！\n（2）中心论点：臣闻吏议逐客，窃以为过矣（驱逐客卿是错误的）。\n（3）举例论证（四君用客）、归纳论证（由四君之事归纳出“客有功于秦”）、对比论证（用客则强，逐客则危）。'},

{id:'H03',r:'H',y:'2025',src:'真题',t:'text',tag:'黄山记',
 stem:'阅读《黄山记》选段，回答问题。\n①这样布置后，它打开了它的云库，拨给这区域的，有倏来倏去的云，扑朔迷离的雾，绮丽多采的霞光，雪浪滚滚的云海。②云海五座，如五大洋，汹涌澎湃。③被雪浪拍击的山峰，或被吞没，或露顶巅，沉浮其中。④然后，大自然又毫不吝惜地赐予几千种植物。⑤它处处散下了天女花和高山杜鹃。⑥它还特意委托风神带来名贵的松树树种，播在险要处。⑦黄山松铁骨冰肌；异萝松天下罕见。⑧这样，大自然把紫红的峰、雪浪云的海、虚无缥缈的雾、苍翠的松，拿过来组成了无穷尽的幻异的景。\n（1）用“‖”给这段文字划分层次。（3分）\n（2）本段运用了哪些描写手法？（2分）\n（3）本段运用了哪些修辞手法？请举例分析。（3分）',
 ans:'（1）①‖②③④⑤⑥⑦‖⑧\n（2）正面描写与侧面描写相结合（正面写云、雾、霞、松；以山峰“被吞没”“露顶巅”侧面写云海之势）。\n（3）比喻：“云海五座，如五大洋”；拟人：“大自然又毫不吝惜地赐予”“委托风神带来”；排比：“倏来倏去的云，扑朔迷离的雾，绮丽多采的霞光，雪浪滚滚的云海”。'},

{id:'H04',r:'H',y:'2026',src:'真题',t:'text',tag:'宣州谢朓楼饯别校书叔云',
 stem:'阅读《宣州谢朓楼饯别校书叔云》，回答问题。\n弃我去者，昨日之日不可留；乱我心者，今日之日多烦忧。长风万里送秋雁，对此可以酣高楼。蓬莱文章建安骨，中间小谢又清发。俱怀逸兴壮思飞，欲上青天揽明月。抽刀断水水更流，举杯消愁愁更愁。人生在世不称意，明朝散发弄扁舟。\n（1）把全诗分为三层。（3分）\n（2）概括诗中抒发的感情及其变化。（3分）\n（3）概括本诗的思想主旨。（2分）',
 ans:'（1）弃我去者……对此可以酣高楼。‖蓬莱文章……欲上青天揽明月。‖抽刀断水……明朝散发弄扁舟。\n（2）由时光流逝、心烦意乱的忧愤，转为登楼酣饮、纵论文章的豪迈，再落到抽刀断水、举杯消愁的苦闷，最后以“散发弄扁舟”作超脱之想。\n（3）抒发怀才不遇、壮志难酬的苦闷，以及对自由放达生活的向往。'},

{id:'H05',r:'H',y:'',src:'模拟',t:'text',tag:'问说',
 stem:'阅读《问说》开篇，回答问题。\n君子之学必好问。问与学，相辅而行者也。非学无以致疑，非问无以广识；好学而不勤问，非真能好学者也。\n（1）用“‖”划分层次。（2分）\n（2）概括每层大意。（3分）\n（3）本段在论证结构上有什么特点？（3分）',
 ans:'（1）君子之学必好问。‖问与学，相辅而行者也。‖非学无以致疑……非真能好学者也。\n（2）第一层提出“好问”的论点；第二层说明问与学相辅相成；第三层从正反两面论证“不问”不能算真好学。\n（3）先立论、再阐释、后正反论证，层层深入，观点鲜明、章法细密。'},

/* ---------------- I 手法分析 ---------------- */
{id:'I01',r:'I',y:'2025',src:'真题',t:'text',tag:'黄山记',
 stem:'《黄山记》写云海一段，作者是如何把云海写得气势磅礴的？请从描写手法和修辞两个角度分析。',
 ans:'①正面描写与侧面描写结合：正面写云的倏来倏去、雾的扑朔迷离、霞光的绮丽；又借山峰“被吞没”“露顶巅”“沉浮其中”侧面烘托云海之壮阔。\n②修辞：比喻（“云海五座，如五大洋”）、拟人（大自然“赐予”“委托风神”）、排比（“倏来倏去的云，扑朔迷离的雾……”），化静为动，层次丰富。\n③语言简练而热情奔放，长短句交错，读来有气势。'},

{id:'I02',r:'I',y:'2025',src:'真题',t:'text',tag:'现代自然科学中的基础学科',
 stem:'阅读《现代自然科学中的基础学科》选段（“地学也是靠物理……”），回答：\n（1）这段文字运用了哪些说明方法？（3分）\n（2）这段文字主要说明了什么内容？（4分）\n（3）从语言体式看，这段文字属于哪种说明文？（1分）',
 ans:'（1）下定义（“生物学地球观”“化学地球观”“物理学地球观”）、打比方（“像七巧板似的”）、作诠释、分类别（三个时代）、举例子。\n（2）说明地学研究经历了三个时代：生物学地球观、化学地球观、物理学地球观，强调现代地学要依靠物理学。\n（3）平实说明文（科学说明文），语言准确、简明。'},

{id:'I03',r:'I',y:'2026',src:'真题',t:'text',tag:'菊花',
 stem:'阅读《菊花》选段，回答：\n（1）这段文字的结构方式是什么？（3分）\n（2）运用了怎样的说明顺序？（2分）\n（3）主要运用了哪些说明方法？（3分）',
 ans:'（1）并列式与“总—分—总”相结合：先总说菊花，再从品种、栽培、用途等方面并列说明，最后总收。\n（2）逻辑顺序（由种植到品种再到文化用途，由具体到抽象）。\n（3）引用（引古籍诗文）、举例子、分类别、列数字。'},

{id:'I04',r:'I',y:'',src:'样题',t:'text',tag:'望海潮',
 stem:'阅读“市列珠玑，户盈罗绮，竞豪奢”，回答：\n（1）这三句与全词开头哪一句相呼应？（2分）\n（2）用了什么写法？（3分）\n（3）三句各写了什么内容？（3分）',
 ans:'（1）与开头“东南形胜，三吴都会，钱塘自古繁华”中的“繁华”相呼应。\n（2）铺叙和白描：不加雕饰地逐层铺开，由市场之珍、人家之富写到风气之奢。\n（3）“市列珠玑”写商品珍贵丰富、商业繁荣；“户盈罗绮”写百姓富庶；“竞豪奢”写竞尚奢华的风气。'},

{id:'I05',r:'I',y:'',src:'模拟',t:'text',tag:'雷雨',
 stem:'《雷雨》以人物语言的高度个性化著称。请以周朴园与鲁侍萍相认前后的对话为例，说明“潜台词”的作用。',
 ans:'示例：周朴园问“你来干什么？”“谁指使你来的？”表面是询问，潜台词是警惕、试探与推卸，怕侍萍揭穿旧事、动摇其体面。\n鲁侍萍答“命，不公平的命指使我来的！”表面认命，潜台词是控诉命运与社会的不公，暗含对周朴园的谴责。\n作用：不直说而意在言外，既符合人物身份与处境，又让冲突更紧张，人物心理与性格更鲜明。'},

{id:'I06',r:'I',y:'',src:'模拟',t:'text',tag:'宝玉挨打',
 stem:'《宝玉挨打》是如何塑造贾政、贾宝玉、林黛玉、薛宝钗、王夫人等人物性格的？请概括主要方法。',
 ans:'①通过个性化的语言：贾政“不如趁今日结果了他的狗命”，见其严酷；宝玉“就便为这些人死了，也是情愿的”，见其痴情叛逆。\n②通过动作、神态、心理细节：黛玉“两个眼睛肿得桃儿一般”，宝钗“点头叹道”，各见其情。\n③通过对比烘托：贾政之严与贾母之溺、宝钗之含蓄与黛玉之率真相互映衬。\n④在尖锐的戏剧冲突（挨打）中集中展示人物性格。'},

{id:'I07',r:'I',y:'',src:'模拟',t:'text',tag:'断魂枪',
 stem:'《断魂枪》写沙子龙，主要用了哪些手法？请举一例说明。',
 ans:'①白描：不作铺陈，只用简洁的动作、语言写人，如夜里“关好门”“熟习熟习他的五虎断魂枪”。\n②对比烘托：以孙老者的执着、王三胜的浮夸，对比沙子龙的沉默与自尊。\n③细节描写：枪、镖局改客栈等细节，写出时代变迁。\n作用：寥寥数笔，写出武人在枪炮时代的落寞与坚守。'},

/* ---------------- J 主旨情感 ---------------- */
{id:'J01',r:'J',y:'2024',src:'真题',t:'text',tag:'饮酒（其五）',
 stem:'《饮酒（其五）》表达了怎样的思想情感？请结合诗句分析。',
 ans:'表达远离尘嚣、归隐田园的恬淡自适与人生哲思。\n“结庐在人境，而无车马喧”写身居尘世而心不受扰；“心远地自偏”点明心境决定环境；“采菊东篱下，悠然见南山”以白描写悠然自得；“此中有真意，欲辨已忘言”收于不可言说的领悟。全诗情理景融合，见其平淡自然、意韵淳厚。'},

{id:'J02',r:'J',y:'2026',src:'真题',t:'text',tag:'宣州谢朓楼饯别校书叔云',
 stem:'《宣州谢朓楼饯别校书叔云》抒发了怎样的感情？情感是怎样变化的？',
 ans:'抒发怀才不遇、壮志难酬的苦闷与对自由放达的向往。\n情感脉络：开篇“昨日不可留”“今日多烦忧”写时光流逝之愁；继而“长风万里送秋雁，对此可以酣高楼”转为豪迈； “俱怀逸兴壮思飞，欲上青天揽明月”推向高扬； “抽刀断水水更流，举杯消愁愁更愁”跌回苦闷；末句“明朝散发弄扁舟”以超脱作结。起伏跌宕，正是李白式的情感轨迹。'},

{id:'J03',r:'J',y:'',src:'模拟',t:'text',tag:'拣麦穗',
 stem:'《拣麦穗》表达了怎样的思想感情？“小火柿子”有什么象征意义？',
 ans:'表达对童年纯真岁月的怀念、对卖灶糖老汉的感激与思念，以及对美好易逝的怅惘。\n“小火柿子”是老汉留给“我”的念想，象征纯真、温暖、朴素的关爱，也象征易逝的美好；结尾“小火柿子”仍在，人已不在，物是人非，情感深沉。'},

{id:'J04',r:'J',y:'',src:'模拟',t:'text',tag:'丑石',
 stem:'《丑石》蕴含了什么哲理？',
 ans:'以一块“丑到极处”的陨石为喻：它因不属于地球、不能垒墙、不能洗石，被乡人嫌弃，后经天文学家鉴定为陨石而身价百倍。\n哲理：价值不以外观论，平凡甚至“丑陋”的事物可能蕴藏伟大；世俗的功利标准常常遮蔽真价值；人应耐得住误解，也要学会不以貌取物。'},

{id:'J05',r:'J',y:'',src:'模拟',t:'text',tag:'黄州新建小竹楼记',
 stem:'《黄州新建小竹楼记》表达了怎样的思想感情？',
 ans:'写竹楼的地理、四时、人事之景，抒发贬谪中的旷达自适与随遇而安。\n以竹楼“清虚”之乐反衬仕途奔波之苦，又以“幸后之人与我同志，嗣而葺之”寄望后来者，见其不以贬谪为意的胸襟。'},

{id:'J06',r:'J',y:'',src:'模拟',t:'text',tag:'钓台的春昼',
 stem:'《钓台的春昼》抒发了怎样的情感？',
 ans:'借游严子陵钓台，写山水之美与内心之郁：既有对自然清境的向往，也有对现实黑暗、身世飘零的苦闷。\n文章把风景画、风俗画与社会风云熔于一炉，景物与心情相映，结尾的怅惘更见其隐逸之思与不平之气。'},

{id:'J07',r:'J',y:'',src:'模拟',t:'text',tag:'我爱这土地',
 stem:'《我爱这土地》中“土地”“鸟”有何象征意蕴？',
 ans:'“土地”象征饱受苦难的祖国；“鸟”象征诗人自己。\n诗人以“嘶哑的喉咙”歌唱，死后“连羽毛也腐烂在土地里面”，表达与祖国生死与共的深沉爱意；“为什么我的眼里常含泪水？因为我对这土地爱得深沉”直抒胸臆，收束全诗。'},

/* ---------------- K 说明文专项 ---------------- */
{id:'K01',r:'K',y:'',src:'模拟',t:'text',tag:'中国建筑的特征',
 stem:'《中国建筑的特征》的说明中心是什么？文章在结构上有什么特点？',
 ans:'说明中心：概括中国建筑的七个特征（结构、布局、材料、装饰等），并以“词汇”“文法”比喻建筑构件与营造规则，说明中国建筑体系的独特与统一。\n结构：总—分—总；主体部分并列展开七个特征，条理清晰；语言准确、通俗，兼有学术性与可读性。'},

{id:'K02',r:'K',y:'',src:'模拟',t:'text',tag:'青蒿素',
 stem:'《青蒿素：人类征服疾病的一小步》在写作上有什么特点？',
 ans:'①以时间为序，叙述青蒿素从古籍检索、实验筛选到临床验证的过程，条理清晰。\n②语言平实准确，数据具体，体现科学研究的严谨。\n③在叙事中融入科学工作者的责任感与奉献精神，情理兼备。'},

{id:'K03',r:'K',y:'',src:'模拟',t:'text',tag:'现代自然科学中的基础学科',
 stem:'《现代自然科学中的基础学科》的说明中心与结构方式是什么？',
 ans:'说明中心：现代自然科学中数学、物理、化学、天文学、地学、生物学的关系，强调物理、数学是最基础学科。\n结构：总—分—总；先总说，再分说各学科，最后总结基础学科的地位。\n说明方法：下定义、打比方、作诠释、分类别、举例子。'},

{id:'K04',r:'K',y:'',src:'模拟',t:'text',tag:'菊花',
 stem:'《菊花》多处引用古籍诗文，有什么作用？',
 ans:'①说明菊花栽培历史悠久、品种繁多，增强说明的权威性与可信度。\n②说明菊花在文化、药用、观赏等方面的价值，丰富说明内容。\n③使平实的说明文增添文化气息与可读性。'},

{id:'K05',r:'K',y:'',src:'模拟',t:'text',tag:'奇妙的克隆',
 stem:'《奇妙的克隆》主要运用了哪些说明方法？请各举一例。',
 ans:'①下定义：给“克隆”下定义，说明其“无性繁殖”的本质。\n②作诠释：解释“克隆”含义的扩展。\n③举例子：细菌一分为二、克隆羊多利等。\n④作比较：有性繁殖与无性繁殖对比。\n⑤列数字：“一个细菌经过20分钟左右就可一分为二”。\n⑥引用：引述科学家的话或资料。'}
);

{id:'M01',r:'M',y:'2024',src:'真题',t:'text',tag:'学习的苦与乐',
 stem:'【2024 真题】材料：有人说“书山有路勤为径，学海无涯苦作舟”“宝剑锋从磨砺出，梅花香自苦寒来”；也有人说“学而时习之，不亦乐乎”，现在应该追求快乐学习。\n请写出你的中心论点，并列出三个分论点（不必成文）。',
 ans:'参考立意：学习的苦与乐并非对立，而是相辅相成——以苦为径，方能得乐；真正的“乐”来自克服困难后的收获。\n分论点示例：\n①苦是乐的起点：刻苦积累才能跨过入门之难。\n②乐是苦的动力：兴趣与成就感使苦学得以持久。\n③苦乐相生：把“苦”转化为“乐”，才是可持续的学习之道。\n注意：不能只写“苦”或只写“乐”，要辩证统一，结合自身体验。'},

{id:'M02',r:'M',y:'2026',src:'真题',t:'text',tag:'奋进与躺平',
 stem:'【2026 真题】材料：有人主张“奋进”，认为青春应当拼搏；也有人选择“躺平”，认为不必过度内卷。\n请写出中心论点与三个分论点，并各配一个论据（人物或事例）。',
 ans:'参考立意：拒绝消极躺平，也反对盲目内卷；以有方向的奋进实现自我价值。\n分论点示例：\n①躺平看似解脱，实则放弃成长——论据：方仲永“泯然众人”。\n②奋进要有方向，不能沦为无效内卷——论据：鲁迅弃医从文，找准救国方向。\n③真正的奋进是可持续的：张弛有度、久久为功——论据：苏炳添科学训练、突破极限。\n结尾可落到“以奋进之姿，行稳致远”。'},

{id:'M03',r:'M',y:'',src:'样题',t:'text',tag:'国风国潮',
 stem:'【大纲样题】材料：国风国潮兴起，古风歌曲、文创产品、汉服、文博节目受到年轻人追捧。请围绕“如何看待、理解国风国潮流行这一社会现象”作文。\n请写出中心论点与写作思路。',
 ans:'参考立意：国风国潮是文化自信的青春表达，既要肯定其激活传统之功，也要警惕符号化、表面化。\n思路：\n①是什么：国风国潮是传统文化元素与现代生活方式的融合。\n②为什么：国家实力提升带来文化自信；年轻人需要身份认同；媒介与文创提供传播载体。\n③怎么办：深挖文化内核，避免“贴标签”；鼓励原创，让传统“活”在当代。\n可用的天津本地素材：杨柳青年画、相声、鼓楼等。'},

{id:'M04',r:'M',y:'',src:'模拟',t:'text',tag:'论证方法',

 ans:'①举例论证：用具体事例证明观点，增强说服力。例：论“坚持”，举司马迁忍辱著《史记》。\n②对比论证：通过正反对照突出观点。例：论“环境与成才”，对比“孟母三迁”与“放任自流”。\n③比喻论证：把抽象道理形象化。例：论“积累”，以“泰山不让土壤，故能成其大”作比。\n注意：例子要典型、扣题，不能以叙代议。'},

{id:'M05',r:'M',y:'',src:'模拟',t:'text',tag:'五段三分式',
 stem:'请写出“五段三分式”议论文的基本结构，并说明每部分字数与写作要点。',
 ans:'①引论（约100字）：引材料、破题、提出中心论点，开门见山。\n②本论一（约180字）：分论点1＋论据＋分析。\n③本论二（约180字）：分论点2＋论据＋分析。\n④本论三（约180字）：分论点3＋论据＋分析。\n⑤结论（约100字）：总结升华，回扣中心。\n要点：三个分论点最好并列或递进，句式整齐；每段“观点句—材料句—分析句—小结句”。'},

{id:'M06',r:'M',y:'',src:'模拟',t:'text',tag:'论据',
 stem:'议论文的论据分为哪两类？使用时各要注意什么？',
 ans:'①事实论据：史实、事例、数据等。要注意真实、典型、扣题，叙述简洁，重在分析。\n②道理论据：名言、格言、原理、诗文等。要注意准确、权威、与观点契合，不能只堆砌不分析。\n共同要求：论据为论点服务，叙议结合，避免“以叙代议”“有据无析”。'},

{id:'M07',r:'M',y:'',src:'模拟',t:'text',tag:'开头',

{id:'X501',r:'X5',y:'',src:'拓展',k:1,t:'text',tag:'田单列传',
 stem:'《田单列传》中田单的形象有哪些特点？请分点概括。',
 ans:'①杰出的爱国者：国难当头挺身而出，以复齐为己任。\n②卓越的军事才能：用反间计使燕王换掉乐毅，以火牛阵夜袭破敌。\n③超人的智慧与谋略：善于利用敌方矛盾、鼓舞士气（如让燕军割齐俘鼻子、掘齐人祖坟以激怒齐人）。\n④能屈能伸、善用人：对士卒“师事之”，与士兵同甘苦。'},

{id:'X502',r:'X5',y:'',src:'拓展',k:1,t:'text',tag:'种树郭橐驼',
 stem:'《种树郭橐驼传》是如何用类比说理的？',
 ans:'以“种树”类比“治民”：\n①种树要“顺木之天，以致其性”，不可“爱之太恩，忧之太勤”；\n②治民 likewise 要顺应百姓本性，不可政令繁苛、催逼扰民；\n③“虽曰爱之，其实害之”既写种树之误，也讽官吏“好烦其令”之弊。\n类比使抽象道理具体可感，讽刺含蓄有力。'},

{id:'X503',r:'X5',y:'',src:'拓展',k:1,t:'text',tag:'黄州小竹楼',
 stem:'《黄州新建小竹楼记》第三段写至道年间以来的经历，有什么作用？',
 ans:'①以自己多年奔波的仕途经历，反衬竹楼“清虚”之乐；\n②越写奔波之苦、贬谪之远，越显随遇而安的旷达；\n③为末段“幸后之人与我同志，嗣而葺之”作铺垫，寄望后来者。\n这是典型的反衬写法。'},

{id:'X504',r:'X5',y:'',src:'拓展',k:1,t:'text',tag:'西湖七月半',
 stem:'《西湖七月半》写五类游客，用了什么手法？有什么作用？',
 ans:'①分类描写：把“看月者”分为五类，逐一写其身份、做派；\n②对比映衬：以俗衬雅，前四类“看月”实为看人、凑热闹，第五类才是真正赏月；\n③作用：在对比中显出雅俗之别，寄托作者的身世之感与清高情怀，也使文章层次分明、讽刺含蓄。'},

{id:'X505',r:'X5',y:'',src:'拓展',t:'text',tag:'黄山记',
 stem:'《黄山记》写云海一段，用了哪些描写手法和修辞？',
 ans:'①正面描写与侧面描写结合：正面写云、雾、霞、松；借山峰“被吞没”“露顶巅”侧面烘托云海之势；\n②修辞：比喻（“云海五座，如五大洋”）、拟人（大自然“赐予”“委托风神”）、排比（“倏来倏去的云，扑朔迷离的雾……”）；\n③语言简练热情，长短句交错，气势奔放。'},

{id:'X506',r:'X5',y:'',src:'拓展',t:'text',tag:'拣麦穗',
 stem:'《拣麦穗》中“小火柿子”有什么象征意义？',
 ans:'①是卖灶糖老汉留给“我”的念想，象征老汉对“我”的疼爱；\n②象征童年纯真、温暖而朴素的情感；\n③象征易逝的美好：结尾小火柿子仍在而人已不在，物是人非，怅惘深沉。'},

{id:'X507',r:'X5',y:'',src:'拓展',t:'text',tag:'丑石',
 stem:'《丑石》是如何托物言志的？',
 ans:'①先极写石之“丑”：黑黝黝、牛似的模样，不能垒墙、不能洗石、不能刻字，被乡人嫌弃；\n②再写其“美”：天文学家鉴定为陨石，从天上落下一场“伟大的相遇”；\n③托物言志：借丑石寓“价值不以外观论”“平凡中可能蕴藏伟大”的哲理，也含对世俗功利眼光的批评。'},

{id:'X508',r:'X5',y:'',src:'拓展',k:1,t:'text',tag:'饮酒',
 stem:'《饮酒（其五）》是如何做到情景理融合的？',
 ans:'①景：“采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还”，白描写田园晚景；\n②情：悠然自得、恬淡闲适；\n③理：“心远地自偏”说明心境决定环境，“此中有真意，欲辨已忘言”把领悟推向不可言说之境。\n三者浑然一体，见陶诗平淡自然、意韵淳厚的特点。'},

{id:'X509',r:'X5',y:'',src:'拓展',t:'text',tag:'山居秋暝',
 stem:'《山居秋暝》写景有什么特点？',
 ans:'①白描：不加浓彩，“明月松间照，清泉石上流”纯用简笔；\n②动静相衬：月照是静、泉流是动；\n③视听结合：月、泉为视觉，竹喧、莲动为听觉；\n④意境清幽，寄托归隐之思。'},

{id:'X510',r:'X5',y:'',src:'拓展',k:1,t:'text',tag:'宣州谢朓楼',
 stem:'《宣州谢朓楼饯别校书叔云》的情感是怎样变化的？',
 ans:'①开篇“昨日不可留”“今日多烦忧”，写时光流逝、心烦意乱；\n②“长风万里送秋雁，对此可以酣高楼”转为豪迈；\n③“俱怀逸兴壮思飞，欲上青天揽明月”推向高扬；\n④“抽刀断水水更流，举杯消愁愁更愁”跌回苦闷；\n⑤“人生在世不称意，明朝散发弄扁舟”以超脱作结。\n起伏跌宕，正是李白式的情感轨迹。'},

{id:'X511',r:'X5',y:'',src:'拓展',t:'text',tag:'丽人行',
 stem:'《丽人行》是如何讽刺杨氏兄妹的？',
 ans:'①不直接议论，而在叙事描写中寓讽刺：写三月三日曲江游春的排场、服饰、饮食；\n②以“犀箸厌饫久未下”“黄门飞鞚不动尘”等细节写其骄奢；\n③以“炙手可热势绝伦，慎莫近前丞相嗔”收束，锋芒毕露；\n④讽刺含蓄而尖锐，体现杜诗“诗史”笔法。'},

{id:'X512',r:'X5',y:'',src:'拓展',t:'text',tag:'书愤',
 stem:'《书愤》是如何用典和对比的？',
 ans:'①用典：“塞上长城空自许”用檀道济自比长城之典，“出师一表真名世”用诸葛亮《出师表》之典；\n②对比：早年“楼船夜雪瓜洲渡，铁马秋风大散关”的雄壮，与晚年“镜中衰鬓已先斑”的落寞对比；\n③作用：抒壮志难酬、报国无门的悲愤，沉郁顿挫。'},

{id:'X513',r:'X5',y:'',src:'拓展',k:1,t:'text',tag:'望海潮',
 stem:'《望海潮》的铺叙手法体现在哪里？',
 ans:'①由总到分：先总写“东南形胜，三吴都会，钱塘自古繁华”，再分写城市、市场、湖山、市井；\n②层层铺开：如“市列珠玑，户盈罗绮，竞豪奢”写市井之富；“重湖叠巘清嘉”写湖山之秀；\n③铺叙中兼用白描，语言通俗，音律谐婉，把杭州写得富丽动人。'},

{id:'X514',r:'X5',y:'',src:'拓展',t:'text',tag:'定风波',
 stem:'《定风波》是如何表现旷达襟怀的？',
 ans:'①借事说理：途中遇雨，同行狼狈，独不觉，“何妨吟啸且徐行”；\n②以“竹杖芒鞋轻胜马”“一蓑烟雨任平生”写随遇而安；\n③结尾“也无风雨也无晴”由自然之雨晴上升到人生之得失，表现超然物外的旷达。'},

{id:'X515',r:'X5',y:'',src:'拓展',k:1,t:'text',tag:'水龙吟',
 stem:'《水龙吟·登建康赏心亭》用了哪些典故？各有什么作用？',
 ans:'①“季鹰归未”用张翰思乡归隐之典，反衬自己有家难归、报国无门；\n②“求田问舍，怕应羞见，刘郎才气”用刘备批评许汜之典，表明不屑于只顾私产；\n③“树犹如此”用桓温之典，感叹时光流逝、壮志难酬；\n④借典故含蓄抒怀，使情感深沉而有余味。'},

{id:'X516',r:'X5',y:'',src:'拓展',t:'text',tag:'红烛',
 stem:'《红烛》是如何体现闻一多“三美”主张的？',
 ans:'①音乐美：句式长短错落而节奏鲜明，多用反复、呼告；\n②绘画美：以红烛为核心意象，色彩鲜明，形象饱满；\n③建筑美：诗节匀称、句式大体整齐；\n④内容上以烛自喻，燃烧自己照亮别人，“莫问收获，但问耕耘”集中体现奉献精神。'},

{id:'X517',r:'X5',y:'',src:'拓展',t:'text',tag:'雷雨',
 stem:'《雷雨》中的潜台词有什么作用？请举例说明。',
 ans:'①揭示人物心理：周朴园问“你来干什么？”“谁指使你来的？”表面询问，实则警惕、试探、推卸；\n②加剧戏剧冲突：鲁侍萍“命，不公平的命指使我来的！”表面认命，实则控诉；\n③塑造性格：话语与真意之间的落差，使人物更复杂、更真实；\n④使台词含蓄耐读，给演员留下表演空间。'},

{id:'X518',r:'X5',y:'',src:'拓展',t:'text',tag:'宝玉挨打',
 stem:'《宝玉挨打》是如何在冲突中塑造人物的？',
 ans:'①通过个性化语言：贾政“不如趁今日结果了他的狗命”，见其严酷；宝玉“就便为这些人死了，也是情愿的”，见其痴情叛逆；\n②通过动作、神态、心理细节：黛玉“两个眼睛肿得桃儿一般”，宝钗“点头叹道”；\n③通过对比烘托：贾政之严与贾母之溺、宝钗之含蓄与黛玉之率真；\n④在尖锐冲突中集中展示各人立场与性格。'},

{id:'X519',r:'X5',y:'',src:'拓展',t:'text',tag:'断魂枪',
 stem:'《断魂枪》的白描与对比手法体现在哪里？',
 ans:'①白描：不作铺陈，只用简洁的动作、语言写人，如夜里“关好门”“熟习熟习他的五虎断魂枪”；\n②对比：以孙老者的执着、王三胜的浮夸，对比沙子龙的沉默与自尊；\n③作用：寥寥数笔写出武人在枪炮时代的落寞与坚守，含蓄深沉。'},

{id:'X520',r:'X5',y:'',src:'拓展',k:1,t:'text',tag:'一个文官的死',
 stem:'《一个文官的死》是如何“以小见大”的？',
 ans:'①“小”：只写一个喷嚏、几次道歉这样的小事；\n②“大”：由切尔维亚科夫的惶恐致死，揭示沙俄等级制度下小人物的奴性心理与精神窒息；\n③手法：用语言、神态、心理细节层层推进，结尾以“死”作结，讽刺辛辣而沉重。'}
);

{id:'X610',r:'X6',y:'',src:'拓展',k:1,t:'text',tag:'五段三分式',
 stem:'请写出“五段三分式”议论文的结构，并说明每部分写作要点。',
 ans:'①引论（约100字）：引材料、破题、提出中心论点；\n②本论一（约180字）：分论点1＋论据＋分析；\n③本论二（约180字）：分论点2＋论据＋分析；\n④本论三（约180字）：分论点3＋论据＋分析；\n⑤结论（约100字）：总结升华、回扣中心。\n要点：三个分论点并列或递进，句式整齐；每段“观点句—材料句—分析句—小结句”。'},

{id:'X611',r:'X6',y:'',src:'拓展',t:'text',tag:'分论点',
 stem:'以“奋斗的青春最美丽”为中心论点，拟写三个分论点。',
 ans:'示例：\n①奋斗让青春有方向：没有目标的青春容易随波逐流。\n②奋斗让青春有厚度：在攻坚克难中增长才干、磨砺意志。\n③奋斗让青春有价值：把个人理想融入时代，才能绽放光彩。\n要求：三个分论点围绕中心、角度不重复，最好句式一致。'},

{id:'X612',r:'X6',y:'',src:'拓展',t:'text',tag:'比喻论证',
 stem:'什么是比喻论证？请以“积累”为话题写一个比喻论证的段落。',
 ans:'比喻论证是用人们熟悉的事物作比，把抽象道理讲得形象易懂。\n示例：积累如筑塔，一砖一瓦看似微不足道，日复一日却能耸入云霄；若急于求成、跳过底层，塔便立不住。学习亦然，今日多读一页书、多记一个词，都是在为明天的高度打地基。\n注意：比喻要贴切，喻体与本体在道理上一致，不能只堆砌辞藻。'},

{id:'X613',r:'X6',y:'',src:'拓展',t:'text',tag:'论据',
 stem:'议论文的论据分为哪两类？使用时各要注意什么？',
 ans:'①事实论据：史实、事例、数据等，要真实、典型、扣题，叙述简洁，重在分析；\n②道理论据：名言、格言、原理、诗文等，要准确、权威、与观点契合；\n共同要求：论据为论点服务，叙议结合，避免“以叙代议”“有据无析”。'},

{id:'X614',r:'X6',y:'',src:'拓展',t:'text',tag:'开头',
 stem:'材料作文的开头怎样写才能“入题快、有文采”？请写出一种结构并配示例。',
 ans:'结构：引材料（1句）＋析材料（1—2句）＋亮观点（1句）。\n示例：“当‘躺平’成为一些年轻人的口头禅，我们更应追问：青春究竟该以何种姿态度过？在我看来，真正的青春不是躺平，而是有方向的奋进。”\n要点：不抄原材料长句，抓关键词；观点句独立鲜明；可适当用比喻、引用增文采，但不堆砌。'},

{id:'X615',r:'X6',y:'',src:'拓展',t:'text',tag:'结尾',
 stem:'议论文结尾常见的三种写法是什么？各举一例。',
 ans:'①总结升华式：回扣中心，提升到时代、人生高度。例：“愿我们都能以奋斗为笔，书写无愧于时代的青春答卷。”\n②呼吁号召式：发出倡议，增强感染力。例：“青年朋友们，与其躺平叹息，不如起身前行！”\n③引用收束式：以名言作结，余味悠长。例：“正如鲁迅所说，‘愿中国青年都摆脱冷气，只是向上走’。”'},

{id:'X616',r:'X6',y:'',src:'拓展',k:1,t:'text',tag:'真题立意',
 stem:'【2026 真题】材料：有人主张“奋进”，认为青春应当拼搏；也有人选择“躺平”，认为不必过度内卷。请写出中心论点与三个分论点。',
 ans:'参考立意：拒绝消极躺平，也反对盲目内卷；以有方向的奋进实现自我价值。\n分论点示例：\n①躺平看似解脱，实则放弃成长——方仲永“泯然众人”。\n②奋进要有方向，不能沦为无效内卷——鲁迅弃医从文，找准救国方向。\n③真正的奋进是可持续的：张弛有度、久久为功——苏炳添科学训练、突破极限。\n结尾可落到“以奋进之姿，行稳致远”。'}
);

</script>

{id:'W02',cat:'文言文',title:'种树郭橐驼传',src:'柳宗元',
 text:'郭橐驼，不知始何名。病偻，隆然伏行，有类橐驼者，故乡人号之“驼”。驼闻之曰：“甚善，名我固当。”因舍其名，亦自谓“橐驼”云。\n其乡曰丰乐乡，在长安西。驼业种树，凡长安豪富人为观游及卖果者，皆争迎取养。视驼所种树，或移徙，无不活，且硕茂早实以蕃。他植者虽窥伺效慕，莫能如也。\n有问之，对曰：“橐驼非能使木寿且孳也，能顺木之天，以致其性焉尔。凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。既然已，勿动勿虑，去不复顾。其莳也若子，其置也若弃，则其天者全而其性得矣。故吾不害其长而已，非有能硕茂之也；不抑耗其实而已，非有能早而蕃之也。他植者则不然：根拳而土易；其培之也，若不过焉则不及。苟有能反是者，则又爱之太恩，忧之太勤，旦视而暮抚，已去而复顾。甚者爪其肤以验其生枯，摇其本以观其疏密，而木之性日以离矣。虽曰爱之，其实害之；虽曰忧之，其实仇之。故不我若也。吾又何能为哉？”\n问者曰：“以子之道，移之官理，可乎？”驼曰：“我知种树而已，官理，非吾业也。然吾居乡，见长人者好烦其令，若甚怜焉，而卒以祸。旦暮吏来而呼曰：‘官命促尔耕，勖尔植，督尔获，早缫而绪，早织而缕，字而幼孩，遂而鸡豚。’鸣鼓而聚之，击木而召之。吾小人辍飧饔以劳吏者，且不得暇，又何以蕃吾生而安吾性耶？故病且怠。若是，则与吾业者其亦有类乎？”\n问者曰：“嘻，不亦善夫！吾问养树，得养人术。”传其事以为官戒。',
 notes:[['偻','脊背弯曲'],['隆然','脊背高起的样子'],['蕃','多'],['莳','栽种'],['缫','抽茧出丝'],['飧饔','晚饭和早饭'],['勖','勉励'],['字','养育']],
 points:['类比：以种树之道类比治民之道','对比：郭橐驼“顺木之天”与他植者“爱之太恩”','详略：详写种树之法，略点治民，讽“好烦其令”','主旨：顺应本性、不可扰民']},
{id:'W03',cat:'文言文',title:'黄州新建小竹楼记',src:'王禹偁',
 text:'黄冈之地多竹，大者如椽。竹工破之，刳去其节，用代陶瓦。比屋皆然，以其价廉而工省也。\n子城西北隅，雉堞圮毁，蓁莽荒秽，因作小楼二间，与月波楼通。远吞山光，平挹江濑，幽阒辽夐，不可具状。夏宜急雨，有瀑布声；冬宜密雪，有碎玉声。宜鼓琴，琴调虚畅；宜咏诗，诗韵清绝；宜围棋，子声丁丁然；宜投壶，矢声铮铮然；皆竹楼之所助也。\n公退之暇，披鹤氅，戴华阳巾，手执《周易》一卷，焚香默坐，消遣世虑。江山之外，第见风帆沙鸟、烟云竹树而已。待其酒力醒，茶烟歇，送夕阳，迎素月，亦谪居之胜概也。\n彼齐云、落星，高则高矣；井干、丽谯，华则华矣；止于贮妓女，藏歌舞，非骚人之事，吾所不取。\n吾闻竹工云：“竹之为瓦，仅十稔；若重覆之，得二十稔。”噫！吾以至道乙未岁，自翰林出滁上，丙申移广陵，丁酉又入西掖，戊戌岁除日，有齐安之命，己亥闰三月到郡。四年之间，奔走不暇；未知明年又在何处，岂惧竹楼之易朽乎？幸后之人与我同志，嗣而葺之，庶斯楼之不朽也。\n咸平二年八月十五日记。',
 notes:[['椽','椽子'],['刳','剖开'],['比屋','挨家挨户'],['挹','舀取，此指引取'],['雉堞','城墙上的矮墙'],['稔','年'],['葺','修缮']],
 points:['四角度写竹楼：位置、山川、四时、人事','反衬：以齐云、落星等名楼反衬竹楼之清虚','第三段写奔波经历，反衬随遇而安的旷达','语言：骈散结合']},
{id:'W04',cat:'文言文',title:'西湖七月半',src:'张岱',
 text:'西湖七月半，一无可看，止可看看七月半之人。看七月半之人，以五类看之：其一，楼船箫鼓，峨冠盛筵，灯火优傒，声光相乱，名为看月而实不见月者，看之；其一，亦船亦楼，名娃闺秀，携及童娈，笑啼杂之，环坐露台，左右盼望，身在月下而实不看月者，看之；其一，亦船亦声歌，名妓闲僧，浅斟低唱，弱管轻丝，竹肉相发，亦在月下，亦看月，而欲人看其看月者，看之；其一，不舟不车，不衫不帻，酒醉饭饱，呼群三五，跻入人丛，昭庆、断桥，嚣呼嘈杂，装假醉，唱无腔曲，月亦看，看月者亦看，不看月者亦看，而实无一看者，看之；其一，小船轻幌，净几暖炉，茶铛旋煮，素瓷静递，好友佳人，邀月同坐，或匿影树下，或逃嚣里湖，看月而人不见其看月之态，亦不作意看月者，看之。\n杭人游湖，巳出酉归，避月如仇。是夕好名，逐队争出，多犒门军酒钱，轿夫擎燎，列俟岸上。一入舟，速舟子急放断桥，赶入胜会。以故二鼓以前，人声鼓吹，如沸如撼，如魇如呓，如聋如哑。大船小船一齐凑岸，一无所见，止见篙击篙，舟触舟，肩摩肩，面看面而已。少刻兴尽，官府席散，皂隶喝道去。轿夫叫船上人，怖以关门，灯笼火把如列星，一一簇拥而去。岸上人亦逐队赶门，渐稀渐薄，顷刻散尽矣。\n吾辈始舣舟近岸，断桥石磴始凉，席其上，呼客纵饮。此时月如镜新磨，山复整妆，湖复颒面，向之浅斟低唱者出，匿影树下者亦出。吾辈往通声气，拉与同坐。韵友来，名妓至，杯箸安，竹肉发。月色苍凉，东方将白，客方散去。吾辈纵舟，酣睡于十里荷花之中，香气拍人，清梦甚惬。',

{id:'W06',cat:'文言文',title:'谏逐客书',src:'李斯',
 text:'臣闻吏议逐客，窃以为过矣。\n昔穆公求士，西取由余于戎，东得百里奚于宛，迎蹇叔于宋，来丕豹、公孙支于晋。此五子者，不产于秦，而穆公用之，并国二十，遂霸西戎。孝公用商鞅之法，移风易俗，民以殷盛，国以富强，百姓乐用，诸侯亲服，获楚、魏之师，举地千里，至今治强。惠王用张仪之计，拔三川之地，西并巴、蜀，北收上郡，南取汉中，包九夷，制鄢、郢，东据成皋之险，割膏腴之壤，遂散六国之从，使之西面事秦，功施到今。昭王得范雎，废穰侯，逐华阳，强公室，杜私门，蚕食诸侯，使秦成帝业。此四君者，皆以客之功。由此观之，客何负于秦哉！向使四君却客而不内，疏士而不用，是使国无富利之实，而秦无强大之名也。\n今陛下致昆山之玉，有随、和之宝，垂明月之珠，服太阿之剑，乘纤离之马，建翠凤之旗，树灵鼍之鼓。此数宝者，秦不生一焉，而陛下说之，何也？必曰秦之所生然后可，则是夜光之璧不饰朝廷，犀象之器不为玩好，郑、卫之女不充后宫，而骏良𫘧駬不实外厩，江南金锡不为用，西蜀丹青不为采。所以饰后宫、充下陈、娱心意、说耳目者，必出于秦然后可，则是宛珠之簪、傅玑之珥、阿缟之衣、锦绣之饰不进于前，而随俗雅化、佳冶窈窕赵女不立于侧也。夫击瓮叩缶，弹筝搏髀，而歌呼呜呜快耳者，真秦之声也；《郑》《卫》《桑间》《昭》《虞》《武》《象》者，异国之乐也。今弃击瓮叩缶而就《郑》《卫》，退弹筝而取《昭》《虞》，若是者何也？快意当前，适观而已矣。今取人则不然，不问可否，不论曲直，非秦者去，为客者逐。然则是所重者在乎色、乐、珠玉，而所轻者在乎人民也。此非所以跨海内、致诸侯之术也。\n臣闻地广者粟多，国大者人众，兵强则士勇。是以太山不让土壤，故能成其大；河海不择细流，故能就其深；王者不却众庶，故能明其德。是以地无四方，民无异国，四时充美，鬼神降福，此五帝三王之所以无敌也。今乃弃黔首以资敌国，却宾客以业诸侯，使天下之士退而不敢西向，裹足不入秦，此所谓“藉寇兵而赍盗粮”者也。\n夫物不产于秦，可宝者多；士不产于秦，而愿忠者众。今逐客以资敌国，损民以益仇，内自虚而外树怨于诸侯，求国无危，不可得也。',
 notes:[['窃','私下，谦辞'],['过','错误'],['来','使动，使……来'],['从','通“纵”，合纵'],['说','通“悦”'],['让','拒绝'],['择','挑剔'],['赍','送给']],

{id:'W07',cat:'文言文',title:'答司马谏议书',src:'王安石',
 text:'某启：昨日蒙教，窃以为与君实游处相好之日久，而议事每不合，所操之术多异故也。虽欲强聒，终必不蒙见察，故略上报，不复一一自辨。盖念蒙君实视遇厚，于反覆不宜卤莽，故今具道所以，冀君实或见恕也。\n盖儒者所争，尤在于名实，名实已明，而天下之理得矣。今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以谓受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官；举先王之政，以兴利除弊，不为生事；为天下理财，不为征利；辟邪说，难壬人，不为拒谏。至于怨诽之多，则固前知其如此也。\n人习于苟且非一日，士大夫多以不恤国事、同俗自媚于众为善，上乃欲变此，而某不量敌之众寡，欲出力助上以抗之，则众何为而不汹汹然？盘庚之迁，胥怨者民也，非特朝廷士大夫而已。盘庚不为怨者故改其度，度义而后动，是而不见可悔故也。如君实责我以在位久，未能助上大有为，以膏泽斯民，则某知罪矣；如曰今日当一切不事事，守前所为而已，则非某之所敢知。\n无由会晤，不任区区向往之至！',
 notes:[['蒙教','承蒙（您）指教'],['游处','交往相处'],['卤莽','鲁莽、草率'],['壬人','巧言谄媚的人'],['盘庚之迁','商王盘庚迁都'],['膏泽','恩惠，此作动词“施恩”']],

{id:'W08',cat:'文言文',title:'问说',src:'刘开',
 text:'君子之学必好问。问与学，相辅而行者也。非学无以致疑，非问无以广识；好学而不勤问，非真能好学者也。理明矣，而或不达于事；识其大矣，而或不知其细，舍问，其奚决焉？\n贤于己者，问焉以破其疑，所谓“就有道而正”也。不如己者，问焉以求一得，所谓“以能问于不能，以多问于寡”也。等于己者，问焉以资切磋，所谓交相问难，审问而明辨之也。《书》不云乎？“好问则裕。”孟子论“求放心”，而并称曰“学问之道”，学即继以问也。子思言“尊德性”，而归于“道问学”，问且先于学也。\n古之人虚中乐善，不择事而问焉，不择人而问焉，取其有益于身而已。是故狂夫之言，圣人择之；刍荛之微，先民询之。舜以天子而询于匹夫，以大知而察及迩言，非苟为谦，诚取善之弘也。三代而下，有学而无问，朋友之交，至于劝善规过足矣，其以义理相咨访，孜孜焉唯进修是急，未之多见也，况流俗乎？\n是己而非人，俗之同病。学有未达，强以为知；理有未安，妄以臆度。如是，则终身几无可问之事。贤于己者，忌之而不愿问焉；不如己者，轻之而不屑问焉；等于己者，狎之而不甘问焉，如是，则天下几无可问之人。人不足服矣，事无可疑矣，此唯师心自用耳。夫自用，其小者也；自知其陋而谨护其失，宁使学终不进，不欲虚以下人，此为害于心术者大，而蹈之者常十之八九。\n不然，则所问非所学焉：询天下之异文鄙事以快言论；甚且心之所已明者，问之人以试其能；事之至难解者，问之人以穷其短。而非是者，虽有切于身心性命之事，可以收取善之益，求一屈己焉而不可得也。嗟乎！学之所以不能几于古者，非此之由乎？\n且夫不好问者，由心不能虚也；心之不虚，由好学之不诚也。亦非不潜心专力之故，其学非古人之学，其好亦非古人之好也，不能问宜也。\n智者千虑，必有一失。圣人所不知，未必不为愚人之所知也；愚人之所能，未必非圣人之所不能也。理无专在，而学无止境也，然则问可少耶？《周礼》，外朝以询万民，国之政事尚问及庶人，是故贵可以问贱，贤可以问不肖，而老可以问幼，唯道之所成而已矣。\n孔文子不耻下问，夫子贤之。古人以问为美德，而并不见其有可耻也。后之君子反争以问为耻，然则古人所深耻者，后世且行之而不以为耻者多矣，悲夫！',
 notes:[['奚决','怎么解决'],['虚中','虚心'],['刍荛','割草打柴的人'],['迩言','浅近的话'],['狎','亲近而轻慢'],['师心自用','自以为是'],['几','接近']],
 points:['中心论点：君子之学必好问','正反对比：古之圣人好问与今人耻问','排偶与散句交错，气势雄壮','与《师说》同倡“学必从师/好问”，角度不同']},

{id:'S01',cat:'诗词',title:'蒹葭',src:'《诗经·秦风》',
 text:'蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。\n蒹葭萋萋，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。\n蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从之，宛在水中沚。',

{id:'S02',cat:'诗词',title:'迢迢牵牛星',src:'《古诗十九首》',
 text:'迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。终日不成章，泣涕零如雨。河汉清且浅，相去复几许？盈盈一水间，脉脉不得语。',
 notes:[['擢','伸出'],['杼','织布的梭子'],['零','落下'],['脉脉','含情相视']],
 points:['借神话写人间相思','六处叠字：迢迢、皎皎、纤纤、札札、盈盈、脉脉','五言古诗，刘勰誉为“五言之冠冕”']},
{id:'S03',cat:'诗词',title:'饮酒（其五）',src:'陶渊明',
 text:'结庐在人境，而无车马喧。问君何能尔？心远地自偏。采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。',
 notes:[['结庐','建造住所'],['车马喧','车马的喧闹，指世俗交往'],['心远','心境远离尘俗'],['真意','人生的真谛']],
 points:['情、景、理融合','“心远地自偏”点明主旨','平淡自然、意韵淳厚']},
{id:'S04',cat:'诗词',title:'山居秋暝',src:'王维',
 text:'空山新雨后，天气晚来秋。明月松间照，清泉石上流。竹喧归浣女，莲动下渔舟。随意春芳歇，王孙自可留。',
 notes:[['暝','傍晚'],['浣女','洗衣女子'],['春芳歇','春天的花草凋谢'],['王孙','原指贵族子弟，此指诗人自己']],
 points:['白描：明月、清泉，简笔勾勒','动静相衬、视听结合','归隐之思：反用“王孙兮归来”']},
{id:'S05',cat:'诗词',title:'宣州谢朓楼饯别校书叔云',src:'李白',
 text:'弃我去者，昨日之日不可留；乱我心者，今日之日多烦忧。长风万里送秋雁，对此可以酣高楼。蓬莱文章建安骨，中间小谢又清发。俱怀逸兴壮思飞，欲上青天揽明月。抽刀断水水更流，举杯消愁愁更愁。人生在世不称意，明朝散发弄扁舟。',
 notes:[['校书','校书郎，官名'],['蓬莱文章','指李云的文章'],['小谢','谢朓'],['散发','披散头发，指归隐']],
 points:['歌行体，句式长短错落','情感大起大落：烦忧—豪迈—苦闷—超脱','比喻：抽刀断水']},
{id:'S06',cat:'诗词',title:'丽人行',src:'杜甫',
 text:'三月三日天气新，长安水边多丽人。\n态浓意远淑且真，肌理细腻骨肉匀。\n绣罗衣裳照暮春，蹙金孔雀银麒麟。\n头上何所有？翠微盍叶垂鬓唇。\n背后何所见？珠压腰衱稳称身。\n就中云幕椒房亲，赐名大国虢与秦。\n紫驼之峰出翠釜，水精之盘行素鳞。\n犀箸厌饫久未下，鸾刀缕切空纷纶。\n黄门飞鞚不动尘，御厨络绎送八珍。\n箫鼓哀吟感鬼神，宾从杂遝实要津。\n后来鞍马何逡巡，当轩下马入锦茵。\n杨花雪落覆白苹，青鸟飞去衔红巾。\n炙手可热势绝伦，慎莫近前丞相嗔。',
 notes:[['三月三','上巳节，曲江游春'],['犀箸','犀角筷子'],['厌饫','吃饱腻了'],['黄门','宦官']],
 points:['新题乐府、七言古诗','叙事中抒情：以细节见讽刺','讽刺杨国忠兄妹骄奢']},
{id:'S07',cat:'诗词',title:'书愤',src:'陆游',
 text:'早岁那知世事艰，中原北望气如山。楼船夜雪瓜洲渡，铁马秋风大散关。塞上长城空自许，镜中衰鬓已先斑。出师一表真名世，千载谁堪伯仲间。',
 notes:[['楼船','战船'],['塞上长城','用檀道济自比长城之典'],['伯仲','不相上下'],['衰鬓','衰老的鬓发']],
 points:['用典：塞上长城、出师一表','对比：早年豪情与晚年衰鬓','主旨：壮志难酬、报国无门']},
{id:'S08',cat:'诗词',title:'望海潮',src:'柳永',
 text:'东南形胜，三吴都会，钱塘自古繁华。\n烟柳画桥，风帘翠幕，参差十万人家。\n云树绕堤沙。怒涛卷霜雪，天堑无涯。\n市列珠玑，户盈罗绮，竞豪奢。\n重湖叠巘清嘉。有三秋桂子，十里荷花。\n羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。\n千骑拥高牙。乘醉听箫鼓，吟赏烟霞。\n异日图将好景，归去凤池夸。',
 notes:[['形胜','地理形势优越'],['参差','大约、几乎'],['天堑','天然壕沟，指钱塘江'],['高牙','高扬的牙旗，指长官']],
 points:['铺叙：由总到分、层层展开','白描：市列珠玑、户盈罗绮','题材贡献：以词写都市繁华']},
{id:'S09',cat:'诗词',title:'定风波',src:'苏轼',
 text:'莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。',
 notes:[['吟啸','吟咏长啸'],['芒鞋','草鞋'],['蓑','蓑衣'],['萧瑟','风雨声']],
 points:['描写与议论结合','旷达超脱：一蓑烟雨任平生','哲理：也无风雨也无晴']},
{id:'S10',cat:'诗词',title:'一剪梅',src:'李清照',
 text:'红藕香残玉簟秋。轻解罗裳，独上兰舟。云中谁寄锦书来？雁字回时，月满西楼。\n花自飘零水自流。一种相思，两处闲愁。此情无计可消除，才下眉头，却上心头。',
 notes:[['玉簟','光滑如玉的竹席'],['锦书','书信'],['雁字','大雁排成“一”或“人”字'],['无计','没有办法']],
 points:['上片写景与独处，下片写相思','借景抒情＋直抒胸臆','语言清丽，情致缠绵']},
{id:'S11',cat:'诗词',title:'水龙吟·登建康赏心亭',src:'辛弃疾',
 text:'楚天千里清秋，水随天去秋无际。遥岑远目，献愁供恨，玉簪螺髻。落日楼头，断鸿声里，江南游子。把吴钩看了，栏杆拍遍，无人会，登临意。\n休说鲈鱼堪脍，尽西风，季鹰归未？求田问舍，怕应羞见，刘郎才气。可惜流年，忧愁风雨，树犹如此！倩何人唤取，红巾翠袖，揾英雄泪？',
 notes:[['遥岑','远山'],['吴钩','宝刀'],['季鹰','张翰，思乡归隐'],['求田问舍','只顾置产']],
 points:['上片借景与动作抒孤愤','下片三典：张翰、刘备、桓温','比喻拟人：玉簪螺髻、献愁供恨']},
{id:'S12',cat:'诗词',title:'雪花的快乐',src:'徐志摩',
 text:'假如我是一朵雪花，\n翩翩的在半空里潇洒，\n我一定认清我的方向——\n飞扬，飞扬，飞扬——\n这地面上有我的方向。\n\n不去那冷寞的幽谷，\n不去那凄清的山麓，\n也不上荒街去惆怅——\n飞扬，飞扬，飞扬——\n你看，我有我的方向！\n\n在半空里娟娟的飞舞，\n认明了那清幽的住处，\n等着她来花园里探望——\n飞扬，飞扬，飞扬——\n啊，她身上有朱砂梅的清香！\n\n那时我凭藉我的身轻，\n盈盈的，沾住了她的衣襟，\n贴近她柔波似的心胸——\n消溶，消溶，消溶——\n溶入了她柔波似的心胸！',
 notes:[['翩翩','轻快飞舞的样子'],['潇洒','自由自在'],['方向','象征理想与爱情']],
 points:['新月派“三美”：音乐美、绘画美、建筑美','以雪花自喻，想象飞动','反复“飞扬”形成旋律']},
{id:'S13',cat:'诗词',title:'红烛',src:'闻一多',
 text:'红烛啊！\n这样红的烛！\n诗人啊！\n吐出你的心来比比，\n可是一般颜色？\n\n红烛啊！\n是谁制的蜡——给你躯体？\n是谁点的火——点着灵魂？\n为何更须烧蜡成灰，\n然后才放光出？\n一误再误；\n矛盾！冲突！\n\n红烛啊！\n不误，不误！\n原是要“烧”出你的光来——\n这正是自然的方法。\n\n红烛啊！\n既制了，便烧着！\n烧罢！烧罢！\n烧破世人的梦，\n烧沸世人的血——\n也救出他们的灵魂，\n也捣破他们的监狱！\n\n红烛啊！\n你心火发光之期，\n正是泪流开始之日。\n\n红烛啊！\n匠人造了你，\n原是为烧的。\n既已烧着，\n又何苦伤心流泪？\n哦！我知道了！\n是残风来侵你的光芒，\n你烧得不稳时，\n才着急得流泪！\n\n红烛啊！\n流罢！你怎能不流呢？\n请将你的脂膏，\n不息地流向人间，\n培出慰藉的花儿，\n结成快乐的果子！\n\n红烛啊！\n你流一滴泪，灰一分心。\n灰心流泪你的果，\n创造光明你的因。\n\n红烛啊！\n“莫问收获，但问耕耘。”',
 notes:[['红烛','象征奉献与理想'],['灰心','燃烧成灰'],['耕耘','喻默默付出']],
 points:['托物言志：燃烧自己、照亮别人','“三美”主张的实践','莫问收获，但问耕耘']},
{id:'S14',cat:'诗词',title:'我爱这土地',src:'艾青',
 text:'假如我是一只鸟，我也应该用嘶哑的喉咙歌唱：这被暴风雨所打击着的土地，这永远汹涌着我们的悲愤的河流，这无止息地吹刮着的激怒的风，和那来自林间的无比温柔的黎明……——然后我死了，连羽毛也腐烂在土地里面。\n为什么我的眼里常含泪水？因为我对这土地爱得深沉……',
 notes:[['嘶哑','声音沙哑'],['悲愤','悲痛愤怒'],['黎明','象征希望']],
 points:['象征：土地＝祖国，鸟＝诗人','先铺写后直抒胸臆','结构：前八句铺写，末二句收束']},

{id:'M02',cat:'近代文',title:'黄山记',src:'徐迟',
 text:'【原文节选】只见云气氤氲来，飞升于文殊院、清凉台，飘拂过东海门、西海门，弥漫于北海宾馆、白鹅岭。如此之漂泊无定；若许之变化多端。毫秒之间，景物不同；同一地点，瞬息万变。……几枝松，几个观松人，溶出溶入；一幅幅，有似古山水，笔意简洁。',

{id:'M03',cat:'近代文',title:'拣麦穗',src:'张洁',
 text:'【材料提要】回忆童年拣麦穗的岁月：农村姑娘们一边拣麦穗一边幻想嫁个好人家；“我”却说要嫁给卖灶糖的老汉，老汉也真心疼爱“我”。后来老汉去世，只留下“小火柿子”的念想。',

{id:'M04',cat:'近代文',title:'丑石',src:'贾平凹',
 text:'【原文节选】它黑黝黝地卧在那里，牛似的模样；谁也不知道是什么时候留在这里的，谁也不去理会它。……它不像汉白玉那样的细腻，可以凿下刻字雕花；也不像大青石那样的光滑，可以供来浣纱捶布。……后来，天文学家说，这是一块陨石。',

{id:'M08',cat:'近代文',title:'雷雨（节选）',src:'曹禺',
 text:'【原文节选】周朴园 （忽然严厉地）你来干什么？\n鲁侍萍 不是我要来的。\n周朴园 谁指使你来的？\n鲁侍萍 （悲愤）命，不公平的命指使我来的！',

{"id":"GG0","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《田单列传》中“牛尾热，怒而奔燕军，燕军夜大惊。”的正确译文是：","opts":["牛尾烧热，牛发怒奔向燕军，燕军在夜里大惊。","市场上陈列着珠宝，家家堆满绫罗，竞相奢侈。","这就是所说的借给敌人兵器、送给盗贼粮食啊。","这种情感无法排遣，刚离开眉头，又涌上心头。"],"a":0,"exp":"译文：牛尾烧热，牛发怒奔向燕军，燕军在夜里大惊。"},
{"id":"GG1","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《种树郭橐驼传》中“能顺木之天，以致其性焉尔。”的正确译文是：","opts":["能顺应树木的天性，来尽它的本性罢了。","假如我是一朵雪花，轻快地在半空飞舞。","泰山不拒绝土壤，所以能成就它的高大。","名义上是看月而实际上不见月的，看他们。"],"a":0,"exp":"译文：能顺应树木的天性，来尽它的本性罢了。"},
{"id":"GG2","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《种树郭橐驼传》中“虽曰爱之，其实害之；虽曰忧之，其实仇之。”的正确译文是：","opts":["虽然说是爱护它，其实是害它；虽然说是担心它，其实是仇视它。","夏天适宜急雨，有瀑布般的声音；冬天适宜密雪，有碎玉般的声音。","白白地以“塞上长城”自许，镜中衰老的鬓发已经斑白。","权势热得烫手、无人能比，千万别靠近，免得丞相发怒。"],"a":0,"exp":"译文：虽然说是爱护它，其实是害它；虽然说是担心它，其实是仇视它。"},
{"id":"GG3","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《黄州新建小竹楼记》中“夏宜急雨，有瀑布声；冬宜密雪，有碎玉声。”的正确译文是：","opts":["夏天适宜急雨，有瀑布般的声音；冬天适宜密雪，有碎玉般的声音。","虽然说是爱护它，其实是害它；虽然说是担心它，其实是仇视它。","白白地以“塞上长城”自许，镜中衰老的鬓发已经斑白。","权势热得烫手、无人能比，千万别靠近，免得丞相发怒。"],"a":0,"exp":"译文：夏天适宜急雨，有瀑布般的声音；冬天适宜密雪，有碎玉般的声音。"},
{"id":"GG4","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《黄州新建小竹楼记》中“幸后之人与我同志，嗣而葺之。”的正确译文是：","opts":["希望后来的人与我志趣相同，继续修缮它。","名义上是看月而实际上不见月的，看他们。","那大汉看人像什么也没有一样，目中无人。","假如我是一朵雪花，轻快地在半空飞舞。"],"a":0,"exp":"译文：希望后来的人与我志趣相同，继续修缮它。"},
{"id":"GG5","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《西湖七月半》中“名为看月而实不见月者，看之。”的正确译文是：","opts":["名义上是看月而实际上不见月的，看他们。","那大汉看人像什么也没有一样，目中无人。","希望后来的人与我志趣相同，继续修缮它。","假如我是一朵雪花，轻快地在半空飞舞。"],"a":0,"exp":"译文：名义上是看月而实际上不见月的，看他们。"},
{"id":"GG6","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《齐桓晋文之事》中“以羊易之。”的正确译文是：","opts":["用羊来换它（那头牛）。","所说的那个人，在水的另一边。","不要问收获多少，只问是否耕耘。","明月照在松林间，清泉在石上流淌。"],"a":0,"exp":"译文：用羊来换它（那头牛）。"},
{"id":"GG7","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《齐桓晋文之事》中“权，然后知轻重；度，然后知长短。”的正确译文是：","opts":["称一称，然后才知道轻重；量一量，然后才知道长短。","为什么我的眼里常含泪水？因为我对这土地爱得深沉。","白白地以“塞上长城”自许，镜中衰老的鬓发已经斑白。","抽刀断水，水反而流得更急；举杯消愁，愁却更愁。"],"a":0,"exp":"译文：称一称，然后才知道轻重；量一量，然后才知道长短。"},
{"id":"GG8","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《谏逐客书》中“泰山不让土壤，故能成其大。”的正确译文是：","opts":["泰山不拒绝土壤，所以能成就它的高大。","假如我是一朵雪花，轻快地在半空飞舞。","能顺应树木的天性，来尽它的本性罢了。","名义上是看月而实际上不见月的，看他们。"],"a":0,"exp":"译文：泰山不拒绝土壤，所以能成就它的高大。"},
{"id":"GG9","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《谏逐客书》中“此所谓藉寇兵而赍盗粮者也。”的正确译文是：","opts":["这就是所说的借给敌人兵器、送给盗贼粮食啊。","牛尾烧热，牛发怒奔向燕军，燕军在夜里大惊。","市场上陈列着珠宝，家家堆满绫罗，竞相奢侈。","这种情感无法排遣，刚离开眉头，又涌上心头。"],"a":0,"exp":"译文：这就是所说的借给敌人兵器、送给盗贼粮食啊。"},
{"id":"GG10","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《答司马谏议书》中“受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官。”的正确译文是：","opts":["从皇帝那里接受命令，议订法令制度又在朝廷上修改，然后交给有关部门，不算越权。","夏天适宜急雨，有瀑布般的声音；冬天适宜密雪，有碎玉般的声音。","虽然说是爱护它，其实是害它；虽然说是担心它，其实是仇视它。","白白地以“塞上长城”自许，镜中衰老的鬓发已经斑白。"],"a":0,"exp":"译文：从皇帝那里接受命令，议订法令制度又在朝廷上修改，然后交给有关部门，不算越权。"},
{"id":"GG11","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《问说》中“非学无以致疑，非问无以广识。”的正确译文是：","opts":["不学习就不能发现疑难，不请教就不能增广见识。","看着宝刀，拍遍栏杆，没有人理解我登临的心意。","抽刀断水，水反而流得更急；举杯消愁，愁却更愁。","牛尾烧热，牛发怒奔向燕军，燕军在夜里大惊。"],"a":0,"exp":"译文：不学习就不能发现疑难，不请教就不能增广见识。"},
{"id":"GG12","r":"G","src":"拓展","t":"single","tag":"翻译","stem":"《蒹葭》中“所谓伊人，在水一方。”的正确译文是：","opts":["所说的那个人，在水的另一边。","不要问收获多少，只问是否耕耘。","明月照在松林间，清泉在石上流淌。","披一身蓑衣在烟雨中，任凭一生风雨。"],"a":0,"exp":"译文：所说的那个人，在水的另一边。"},

{id:'LF01',r:'X5',y:'',src:'拓展',k:1,t:'text',tag:'蒹葭',
 stem:'《蒹葭》是怎样用重章叠句来表达追寻之苦的？',
 ans:'三章只换少量字词（苍苍/萋萋/采采，为霜/未晞/未已，一方/之湄/之涘），反复咏叹，层层推进；每章都以“溯洄”“溯游”写追寻之难，以“宛在”写可望不可即，回环往复中强化了执着与怅惘。'},
{id:'LF02',r:'X5',y:'',src:'拓展',t:'text',tag:'迢迢牵牛星',
 stem:'《迢迢牵牛星》中的六处叠字各有什么表达作用？',
 ans:'迢迢写距离之远，皎皎写星光之明，纤纤写手之细柔，札札写机杼之声，盈盈写水之清浅，脉脉写含情相视。六处叠字分别从空间、形象、动作、声音、神态着笔，声情兼备，强化了相思之苦。'},
{id:'LF03',r:'X5',y:'',src:'拓展',k:1,t:'text',tag:'一剪梅',
 stem:'《一剪梅》上下片各写什么？“才下眉头，却上心头”妙在哪里？',
 ans:'上片写红藕香残、独上兰舟，见景思人；下片写花自飘零、水自流，相思难解。末句把无形的愁写得可见可动：眉头方展，心头又起，化静为动，写出愁绪的缠绵难遣。'},
{id:'LF04',r:'X5',y:'',src:'拓展',t:'text',tag:'雪花的快乐',
 stem:'《雪花的快乐》是如何体现新月派“三美”的？',
 ans:'音乐美：音节和谐，“飞扬，飞扬，飞扬”反复咏唱，节奏轻盈；绘画美：雪花、幽谷、山麓、花园、朱砂梅，画面鲜明；建筑美：诗节匀称、句式大体整齐。内容上以雪花自喻，写对爱与自由的追求。'},
{id:'LF05',r:'X5',y:'',src:'拓展',t:'text',tag:'一个消逝了的山村',
 stem:'《一个消逝了的山村》是怎样把写景、想象与哲思结合起来的？',
 ans:'先写眼前残存的石基、树木、山路，再由实入虚，想象山村昔日的生活场景；在描写中融入对生命短暂与延续、历史与时间的思考，使文章由景生理、理在景中，含蓄而有哲思之美。'},
{id:'LF06',r:'X5',y:'',src:'拓展',k:1,t:'text',tag:'人生的境界',
 stem:'《人生的境界》中四种境界的内涵是什么？哲学的任务是什么？',
 ans:'自然境界：顺本能做事；功利境界：为利做事；道德境界：为义做事；天地境界：知天、事天，超越道德而达宇宙情怀。哲学的任务是提高人的精神境界，使人成为“圣人”。'},
{id:'LF07',r:'X5',y:'',src:'拓展',t:'text',tag:'选择与安排',
 stem:'《选择与安排》在选材和结构上各提出了什么主张？',
 ans:'选材：要典型、要舍得割爱，不能堆砌；结构：要层次清楚、轻重分明、首尾呼应，段与段衔接自然。文章以用兵、建筑等作比，兼用类比与对比。'},
{id:'LF08',r:'X5',y:'',src:'拓展',t:'text',tag:'高祖还乡',
 stem:'《高祖还乡》借乡民视角讽刺刘邦，有什么艺术效果？',
 ans:'乡民不识皇帝威仪，只认出“刘三”，把车驾、仪仗、服饰一一拆穿，神圣感被消解；“觑得人如无物”“挪身着手扶”等细节写其傲慢做作。以俗眼观帝王，讽刺辛辣而幽默。'},
{id:'LF09',r:'X5',y:'',src:'拓展',t:'text',tag:'汉宫秋',
 stem:'《汉宫秋》体现了元杂剧的哪些形式特征？主题是什么？',
 ans:'一本四折，由曲词、宾白、科介组成，角色有旦、末、净、丑；曲词可对偶、顶针、用典。主题上借昭君出塞写民族矛盾与家国之痛，寄托兴亡之感。'},
{id:'LF10',r:'X5',y:'',src:'拓展',t:'text',tag:'列夫·托尔斯泰最后的日子',
 stem:'托尔斯泰晚年离家出走的真正意义是什么？',
 ans:'他厌倦贵族生活、追求平民化与精神安宁，出走是与贵族生活的决裂、对精神困境的突围；最终病逝于阿斯塔波沃车站，成为其理想与现实冲突的悲剧结局。'},
{id:'LF11',r:'X5',y:'',src:'拓展',t:'text',tag:'骂杀与捧杀',
 stem:'《骂杀与捧杀》中两种批评方式的危害各是什么？',
 ans:'“骂杀”以棒杀扼杀人才，“捧杀”以吹捧使人飘飘然而失败；两者都是不负责任的批评，都会毁人。文章短小犀利，多用反语，讽刺辛辣。'},
{id:'LF12',r:'X5',y:'',src:'拓展',t:'text',tag:'工匠精神',

{id:'EG1',cat:'英语语法',plain:1,title:'时态',src:'英语语法精讲',
 text:'1. 一般现在时：经常性动作、客观真理。\n2. 一般过去时：过去某时的动作，常与 yesterday、last year 连用。\n3. 现在完成时：have/has＋过去分词，强调对现在的影响；常与 already、yet、since、for 连用。\n4. 过去完成时：had＋过去分词，表示“过去的过去”，常与 by the time＋过去时连用。\n5. 将来时：will do / be going to do。',
 notes:[['since','自从，接时间点'],['for','持续，接时间段'],['by the time','到……时候为止']],
 points:['by the time＋过去时→主句用过去完成时','since/for 是现在完成时的标志','客观真理用一般现在时'],
 theme:'时态题先找时间标志词，再定时态。',author:'天津专升本英语：时态与语态是词汇语法部分的必考点。'},
{id:'EG2',cat:'英语语法',plain:1,title:'非谓语动词',src:'英语语法精讲',
 text:'1. 不定式 to do：表目的、将来。\n2. 动名词 doing：作主语、宾语；介词后接 doing。\n3. 现在分词 doing：主动、进行。\n4. 过去分词 done：被动、完成。\n5. 常见搭配：look forward to doing、suggest doing、be worth doing、be used to doing。',
 notes:[['look forward to','盼望，to 为介词'],['be worth','值得，后接 doing'],['be used to','习惯于']],
 points:['介词后接动名词','suggest/avoid/enjoy 后接 doing','状语从句省略时看主动被动'],
 theme:'非谓语看逻辑主语与主动被动关系。',author:'非谓语是专升本英语的高频失分点。'},
{id:'EG3',cat:'英语语法',plain:1,title:'定语从句',src:'英语语法精讲',
 text:'1. 关系代词：who（人）、which（物）、that（人或物）。\n2. 关系副词：when（时间）、where（地点）、why（原因）。\n3. 介词＋which/whom。\n4. 只能用 that 的情况：先行词为 all、everything、nothing 等；先行词被最高级、序数词修饰。',
 notes:[['先行词','被修饰的名词'],['关系副词','在从句中作状语']],
 points:['看先行词在从句中作什么成分','reason 后用 why','最高级修饰先行词用 that'],
 theme:'定语从句先判断先行词在从句中的成分。',author:'从句是语法部分的重点。'},
{id:'EG4',cat:'英语语法',plain:1,title:'虚拟语气',src:'英语语法精讲',
 text:'1. 与现在事实相反：If＋过去时（be 用 were），主句 would/could＋do。\n2. 与过去事实相反：If＋had done，主句 would have done。\n3. 与将来事实相反：If＋were to do/should do，主句 would do。\n4. 特殊：It is important/necessary that…（should）do；suggest/insist/demand that…（should）do。',
 notes:[['were','虚拟语气中所有人称可用'],['should do','should 常省略']],
 points:['if 从句与主句时态搭配','important/necessary 从句用虚拟','suggest 表“建议”时用虚拟'],
 theme:'虚拟语气看与什么时间事实相反。',author:'虚拟语气是语法题的常客。'},

{id:'HG1',cat:'人力资源',plain:1,title:'工作分析',src:'人力资源管理精讲',
 text:'1. 含义：对岗位的职责、权限、工作关系、任职资格进行系统分析。\n2. 结果：职位说明书（工作描述＋任职资格）。\n3. 方法：观察法、访谈法、问卷法、工作日志法、关键事件法。\n4. 作用：招聘依据、培训依据、绩效标准、薪酬基础、组织设计依据。',
 notes:[['职位说明书','工作描述＋任职资格'],['关键事件法','记录典型有效/无效行为']],
 points:['工作分析≠工作评价','德尔菲法是预测方法，不是工作分析方法','职位说明书是招聘与培训的基础'],
 theme:'工作分析是人力资源管理的基础工作。',author:'天津农学院专业课：工作分析常考名词解释与简答。'},
{id:'HG2',cat:'人力资源',plain:1,title:'绩效管理',src:'人力资源管理精讲',
 text:'1. 流程：绩效计划—绩效辅导—绩效考核—绩效反馈—结果应用。\n2. 工具：KPI、360度考核、平衡计分卡、目标管理（MBO）。\n3. 原则：指标 SMART；考核公平、公开、持续沟通。\n4. 面谈：反馈结果、肯定成绩、指出不足、制定改进计划。',
 notes:[['KPI','关键绩效指标'],['SMART','具体、可衡量、可实现、相关、有时限'],['360度','多主体评价']],
 points:['绩效管理≠绩效考核','核心是持续沟通与改进','SMART 五要素'],
 theme:'绩效管理是循环，不是年底打分。',author:'绩效管理是简答、案例的高频章节。'},
{id:'HG3',cat:'人力资源',plain:1,title:'薪酬管理',src:'人力资源管理精讲',
 text:'1. 构成：基本工资、绩效工资、奖金、津贴、福利。\n2. 原则：公平性、竞争性、激励性、经济性、合法性。\n3. 岗位评价方法：排序法、分类法、因素比较法、因素计点法。\n4. 薪酬调查：了解市场分位，保证外部竞争性。\n5. 宽带薪酬：等级少、带宽大。',
 notes:[['岗位评价','解决内部公平'],['薪酬调查','解决外部竞争'],['宽带薪酬','压缩等级、拉大带宽']],
 points:['内部公平靠岗位评价，外部竞争靠薪酬调查','薪酬五原则','宽带薪酬的特点'],
 theme:'薪酬要兼顾内部公平与外部竞争。',author:'薪酬管理常考简答与案例。'},
{id:'HG4',cat:'人力资源',plain:1,title:'招聘与甄选',src:'人力资源管理精讲',
 text:'1. 渠道：内部（晋升、轮换、内部推荐）与外部（校园、招聘会、网络、猎头）。\n2. 甄选方法：笔试、面试（结构化/非结构化）、评价中心（无领导小组讨论、公文筐）、背景调查。\n3. 标准：信度（测稳）与效度（测准）。\n4. 面试提问：行为面试（STAR）。',
 notes:[['结构化面试','问题与评分标准统一'],['评价中心','情景模拟类测评'],['STAR','情境、任务、行动、结果']],
 points:['内部招聘激励强、成本低，外部招聘带来新思想','效度＝测准，信度＝测稳','无领导小组讨论属评价中心'],
 theme:'招聘要选对渠道，甄选要兼顾信度与效度。',author:'招聘与甄选是专业课重点章节。'}
);

</script>

 ans:'①为企业选拔、任用合格员工奠定基础；\n②为员工考核、晋升提供依据；\n③是改进岗位设计、优化劳动环境的必要条件；\n④是制定人力资源计划、进行人才预测的前提；\n⑤是职位评价的基础，进而为建立公平合理的薪酬制度提供前提。'},
{id:'HR1104',r:'HR11',y:'',src:'真题',t:'text',tag:'2024真题',
 stem:'简述外部招募的优点与缺点。',
 ans:'优点：①面向范围广，可能招到更优秀的人才；②带来新知识、新技能、新观念；③有利于形成开放的组织文化，提高适应力。\n缺点：①对外部人员了解不充分，可能误录；②适应组织与岗位需要较长时间；③过多外部录用会减少内部晋升机会，影响积极性；④可能稀释或改变组织文化。'},
{id:'HR1105',r:'HR11',y:'',src:'真题',t:'text',tag:'2024真题',
 stem:'简述总薪酬的重要组成部分。',
 ans:'一般由四部分构成：\n①基本薪酬：按岗位或技能支付的较稳定收入，是薪酬主体；\n②奖励薪酬（绩效/奖金）：与绩效挂钩；\n③附加薪酬（津贴补贴）：如岗位津贴、加班费等；\n④间接薪酬（员工福利）：如社保、公积金、带薪休假等。'},

/* 农学院 HR 2025 真题（回忆版） */
{id:'HR1201',r:'HR12',y:'',src:'真题',t:'text',tag:'2025真题',
 stem:'简述目标与关键成果（OKR）的关系。',
 ans:'①目标（O）指导关键结果（KR），关键结果支撑目标的实现；\n②关键结果反映目标的进展，是可衡量的；\n③二者相互依赖：没有关键结果的目标是模糊的，没有目标的关键结果是无目的的。'},
{id:'HR1202',r:'HR12',y:'',src:'真题',t:'text',tag:'2025真题',
 stem:'简述制定人力资源战略的步骤。',
 ans:'①确定战略目标；\n②进行人力资源规划（招聘录用计划、绩效考评计划、培训计划等）；\n③制定人事政策；\n④实施与评估调整。'},
{id:'HR1203',r:'HR12',y:'',src:'真题',t:'text',tag:'2025真题',
 stem:'工会是如何协调劳动关系的？',
 ans:'①通过平等协商和集体合同制度；\n②通过职工代表大会制度参与民主管理；\n③通过劳动争议调解制度化解矛盾；\n④维护职工合法权益，促进企业与职工共同发展。'},

{id:'EW04',r:'EN4',src:'考纲',t:'text',tag:'写作·邮件',

{id:'EW05',r:'EN4',src:'考纲',t:'text',tag:'写作·应用文',

{id:'EW06',r:'EN4',src:'考纲',t:'text',tag:'写作·图表',
 stem:'写作：下表是某高职院校学生每天使用手机的时间统计（学习 1 小时、娱乐 2 小时、社交 1 小时、其他 0.5 小时）。请根据图表写一篇不少于 100 词的短文，说明情况并发表看法。',
 ans:'According to the chart, students in our college spend about four and a half hours on their phones every day. Most of the time, about two hours, is spent on entertainment, while only one hour is used for study. Social communication takes another hour, and the rest is used for other things.\nIn my opinion, this is not a good habit. Too much entertainment may waste our time and affect our study. We should make a reasonable plan, use phones mainly for learning, and limit the time on games and short videos. Only in this way can we make good use of technology.'},

 ans:'NOTICE\nTo enrich our school life, an English Culture Festival will be held in the school hall from May 10 to May 12. During the festival, there will be an English speech contest, a singing competition and a short play show. Students who are interested in it can sign up at the Students’ Union before May 5. Please prepare your programmes and hand them in on time. Everyone is welcome to take part in the festival. We believe it will be a wonderful experience for all of us.\nThe Students’ Union'},
{id:'EW09',r:'EN4',src:'考纲',t:'text',tag:'写作·评论',

 ans:'Nowadays, more and more college students take part-time jobs in their spare time. Some work as waiters, and others give lessons to children.\nOn the one hand, part-time jobs can help students gain working experience and learn how to communicate with different people. They can also earn some money and become more independent. On the other hand, if students spend too much time working, their study will certainly be affected. Some students may feel too tired to focus on their lessons.\nIn my opinion, students should keep a balance between work and study. They should choose a job that does not take up too much time and make a clear plan. Only in this way can a part-time job be helpful to their future.'},

<script>
/* 阅读题材料库：简析题会自动带上对应篇目的原文节选或材料提要 */
window.MATERIALS = {
  '田单列传': '【原文节选】田单乃收城中得千余牛，为绛缯衣，画以五彩龙文，束兵刃于其角，而灌脂束苇于尾，烧其端。凿城数十穴，夜纵牛，壮士五千人随其后。牛尾热，怒而奔燕军，燕军夜大惊。……燕军大骇，败走。',
  '种树郭橐驼传': '【原文节选】橐驼非能使木寿且孳也，能顺木之天，以致其性焉尔。凡植木之性，其本欲舒，其培欲平，其土欲故，其筑欲密。……虽曰爱之，其实害之；虽曰忧之，其实仇之。',
  '黄州新建小竹楼记': '【原文节选】黄冈之地多竹，大者如椽。竹工破之，刳去其节，用代陶瓦。比屋皆然，以其价廉而工省也。……远吞山光，平挹江濑，幽阒辽夐，不可具状。夏宜急雨，有瀑布声；冬宜密雪，有碎玉声。',
  '西湖七月半': '【原文节选】西湖七月半，一无可看，止可看看七月半之人。看七月半之人，以五类看之：其一，楼船箫鼓，峨冠盛筵，灯火优傒，声光相乱，名为看月而实不见月者，看之……',
  '钓台的春昼': '【材料提要】郁达夫1932年游桐庐严子陵钓台。文章以游踪为线索，写富春江山水、严陵钓台古迹与沿途风俗，并把个人身世之感、对现实黑暗的不满融入景物之中。',
  '黄山记': '【原文节选】只见云气氤氲来，飞升于文殊院、清凉台，飘拂过东海门、西海门，弥漫于北海宾馆、白鹅岭。如此之漂泊无定；若许之变化多端。毫秒之间，景物不同；同一地点，瞬息万变。一忽儿阳光泛滥；一忽儿雨脚奔驰。却永有云雾，飘去浮来；整个的公园，藏在其中。',
  '拣麦穗': '【材料提要】张洁回忆童年拣麦穗的岁月：农村姑娘们一边拣麦穗一边幻想嫁个好人家；“我”却说要嫁给卖灶糖的老汉，老汉也真心疼爱“我”。后来老汉去世，只留下一个“小火柿子”的念想。',
  '丑石': '【原文节选】它黑黝黝地卧在那里，牛似的模样；谁也不知道是什么时候留在这里的，谁也不去理会它。……它不像汉白玉那样的细腻，可以凿下刻字雕花；也不像大青石那样的光滑，可以供来浣纱捶布。……后来，天文学家说，这是一块陨石。',
  '一个消逝了的山村': '【材料提要】冯至写一个早已消逝的山村：从残存的石基、树木、山路想象昔日的生活，在描写中融入对生命、历史与时间流逝的思考，含蓄而有哲思。',
  '列夫·托尔斯泰最后的日子': '【材料提要】茨威格写托尔斯泰晚年厌倦贵族生活、追求平民化，最终离家出走，病逝于阿斯塔波沃车站。文章在叙事描写中融入议论与抒情，揭示其精神困境。',
  '蒹葭': '蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。\n蒹葭萋萋，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。',
  '迢迢牵牛星': '迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。终日不成章，泣涕零如雨。河汉清且浅，相去复几许？盈盈一水间，脉脉不得语。',
  '饮酒': '结庐在人境，而无车马喧。问君何能尔？心远地自偏。采菊东篱下，悠然见南山。山气日夕佳，飞鸟相与还。此中有真意，欲辨已忘言。',
  '山居秋暝': '空山新雨后，天气晚来秋。明月松间照，清泉石上流。竹喧归浣女，莲动下渔舟。随意春芳歇，王孙自可留。',
  '宣州谢朓楼': '弃我去者，昨日之日不可留；乱我心者，今日之日多烦忧。长风万里送秋雁，对此可以酣高楼。蓬莱文章建安骨，中间小谢又清发。俱怀逸兴壮思飞，欲上青天揽明月。抽刀断水水更流，举杯消愁愁更愁。人生在世不称意，明朝散发弄扁舟。',
  '丽人行': '三月三日天气新，长安水边多丽人。态浓意远淑且真，肌理细腻骨肉匀。……紫驼之峰出翠釜，水精之盘行素鳞。犀箸厌饫久未下，鸾刀缕切空纷纶。黄门飞鞚不动尘，御厨络绎送八珍。……炙手可热势绝伦，慎莫近前丞相嗔。',
  '书愤': '早岁那知世事艰，中原北望气如山。楼船夜雪瓜洲渡，铁马秋风大散关。塞上长城空自许，镜中衰鬓已先斑。出师一表真名世，千载谁堪伯仲间。',
  '望海潮': '东南形胜，三吴都会，钱塘自古繁华。烟柳画桥，风帘翠幕，参差十万人家。……市列珠玑，户盈罗绮，竞豪奢。\n重湖叠巘清嘉。有三秋桂子，十里荷花。羌管弄晴，菱歌泛夜，嬉嬉钓叟莲娃。千骑拥高牙。乘醉听箫鼓，吟赏烟霞。异日图将好景，归去凤池夸。',
  '定风波': '莫听穿林打叶声，何妨吟啸且徐行。竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。\n料峭春风吹酒醒，微冷，山头斜照却相迎。回首向来萧瑟处，归去，也无风雨也无晴。',
  '一剪梅': '红藕香残玉簟秋。轻解罗裳，独上兰舟。云中谁寄锦书来？雁字回时，月满西楼。\n花自飘零水自流。一种相思，两处闲愁。此情无计可消除，才下眉头，却上心头。',
  '水龙吟': '楚天千里清秋，水随天去秋无际。遥岑远目，献愁供恨，玉簪螺髻。落日楼头，断鸿声里，江南游子。把吴钩看了，栏杆拍遍，无人会，登临意。\n休说鲈鱼堪脍，尽西风，季鹰归未？求田问舍，怕应羞见，刘郎才气。可惜流年，忧愁风雨，树犹如此！倩何人唤取，红巾翠袖，揾英雄泪？',
  '雪花的快乐': '假如我是一朵雪花，翩翩的在半空里潇洒，我一定认清我的方向——飞扬，飞扬，飞扬——这地面上有我的方向。',
  '红烛': '红烛啊！这样红的烛！诗人啊！吐出你的心来比比，可是一般颜色？……红烛啊！莫问收获，但问耕耘。',
  '我爱这土地': '假如我是一只鸟，我也应该用嘶哑的喉咙歌唱：这被暴风雨所打击着的土地，这永远汹涌着我们的悲愤的河流，这无止息地吹刮着的激怒的风，和那来自林间的无比温柔的黎明……——然后我死了，连羽毛也腐烂在土地里面。\n为什么我的眼里常含泪水？因为我对这土地爱得深沉……',
  '齐桓晋文之事': '【原文节选】王曰：“何可废也？以羊易之。”……曰：“王无异于百姓之以王为爱也。以小易大，彼恶知之？……是乃仁术也。”',
  '谏逐客书': '【原文节选】臣闻吏议逐客，窃以为过矣。……泰山不让土壤，故能成其大；河海不择细流，故能就其深；王者不却众庶，故能明其德。',
  '答司马谏议书': '【原文节选】今君实所以见教者，以为侵官、生事、征利、拒谏，以致天下怨谤也。某则以谓受命于人主，议法度而修之于朝廷，以授之于有司，不为侵官……',
  '问说': '君子之学必好问。问与学，相辅而行者也。非学无以致疑，非问无以广识；好学而不勤问，非真能好学者也。',
  '骂杀与捧杀': '【材料提要】鲁迅批评两种不负责任的批评：一味“骂杀”与一味“捧杀”。前者棒杀，后者捧杀，都会毁掉人才。文章短小犀利，多用反语。',

    cand.sort(function (a, b) {

      return d !== 0 ? d : (a.i - b.i);
    });
    for (var k = 0; k < cand.length && out.length < n; k++) {

      if (!used[v]) { used[v] = 1; out.push(v); }
    }
    return out;

  function buildMyWordQuestions(pairs) {

        stem: '“' + w + '”的意思是：', opts: [m].concat(pickNearWord(meanings, m, 3, i)), a: 0, exp: w + ' = ' + m });
      BANK.push({ id: 'UM' + i + 'B', r: 'ENW5', src: '我的词表', t: 'single', tag: '看义选词',
        stem: '“' + m + '”对应的单词是：', opts: [w].concat(pickNearWord(words, w, 3, i + 5)), a: 0, exp: m + ' = ' + w });
    });

  function parseWordLines(text) {

      line = line.trim();

      var w = m[1].trim().replace(/\s+/g, ' ');
      var mean = m[2].replace(/^(n|v|vt|vi|adj|adv|prep|pron|conj|num|art|int)\.\s*/i, '').trim();
      if (w && mean) out.push([w, mean]);
    });
    return out;
  }

  function route() {
    var h = location.hash.replace(/^#\/?/, '');
    if (h === 'import') { S.view = 'import'; renderImport(); window.scrollTo(0, 0); return; }
    if (h.indexOf('exam/') === 0) {
      var eid = h.slice(5);
      if (!EXAM || EXAM.id !== eid || EXAM.submitted) startExam(eid);
      S.view = 'exam'; renderExam();
      window.scrollTo(0, 0);
      return;
    }
    if (h === 'exam-result') {
      S.view = 'examresult'; renderExamResult();
      window.scrollTo(0, 0);
      return;
    }
    if (h.indexOf('lect/') === 0) {
      S.view = 'lect'; renderLectIndex(decodeURIComponent(h.slice(5)));
      window.scrollTo(0, 0);
      return;
    }
    if (h.indexOf('lecture/') === 0) {
      S.view = 'lecture'; renderLecture(h.slice(8));
      window.scrollTo(0, 0);
      return;
    }
    clearExamTimer();
    if (h.indexOf('r/') === 0) {
      var rid = h.slice(2);
      if (rid === 'REVIEW' || rid === 'FAV' || rid === 'WRONG') {
        if (!S.rid || S.rid !== rid || !S.list.length) {
          var arr = rid === 'REVIEW' ? reviewQuestions() : (rid === 'FAV' ? favQuestions() : wrongQuestions());
          beginSession(rid, arr);
        }
        S.view = 'quiz'; renderQuiz();
      } else {
        if (!S.rid || S.rid !== rid || !S.list.length) startRegion(rid);
        S.view = 'quiz'; renderQuiz();
      }
    } else if (h === 'wrong') {
      S.view = 'wrong'; renderWrong();
    } else if (h === 'result') {
      S.view = 'result'; renderResult();
    } else {
      S.view = 'home'; renderHome();
    }
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  function bindHome() {
    app.querySelectorAll('[data-region]').forEach(function (n) {
      n.addEventListener('click', function () { go('r/' + n.getAttribute('data-region')); });
    });
    app.querySelectorAll('[data-exam]').forEach(function (n) {
      n.addEventListener('click', function () { go('exam/' + n.getAttribute('data-exam')); });
    });
    app.querySelectorAll('[data-cat]').forEach(function (n) {
      n.addEventListener('click', function () { go('lect/' + encodeURIComponent(n.getAttribute('data-cat'))); });
    });
    app.querySelectorAll('[data-random]').forEach(function (n) {
      n.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var id = n.getAttribute('data-random');
        startRandomPool(regionQuestions(id), (regionById(id) ? regionById(id).name : regionName(id)) + ' · 随机20');
      });
    });
    app.querySelectorAll('[data-subj]').forEach(function (n) {
      n.addEventListener('click', function () { switchSubj(n.getAttribute('data-subj')); });
    });
    app.querySelectorAll('[data-act]').forEach(function (n) {
      n.addEventListener('click', function () {
        var a = n.getAttribute('data-act');
        if (a === 'wrong') go('wrong');
        if (a === 'reset') {
          if (confirm('确定清空所有答题进度和错题吗？')) {
            progress = {}; save(); S.lastResult = null; renderHome();
          }
        }
        if (a === 'continue') {
          var first = null;
          for (var i = 0; i < REGIONS.length; i++) {
            var st = regionStat(REGIONS[i].id);
            if (st.done > 0 && st.done < st.total) { first = REGIONS[i].id; break; }
          }
          if (!first) {
            for (var j = 0; j < REGIONS.length; j++) {
              if (regionStat(REGIONS[j].id).done < regionStat(REGIONS[j].id).total) { first = REGIONS[j].id; break; }
            }
          }
          if (first) go('r/' + first);
          else alert('全部题目都已练完，可以点“重置”重新开始。');
        }
        if (a === 'random') {
          startRandomPool(BANK.filter(function (q) { return subjOf(q) === 'cn'; }), '语文基础 · 随机20');
        }
        if (a === 'toggle-shuffle') {
          settings.shuffle = !settings.shuffle; saveSettings(); renderHome();
        }
      });
    });
  }
